<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0414">
<title>HAMOFLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:#06030d;
  color:#fff;
  min-height:100vh;
  padding-bottom:95px;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

/* ===== HEADER ===== */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(12,5,22,.88);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(168,85,247,.35);
  box-shadow:0 6px 25px rgba(80,20,160,.35);
}
.logo{
  font-size:20px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(90deg,#f0e0ff,#d8b4fe,#a855f7,#c084fc,#fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 12px rgba(168,85,247,.9));
  cursor:pointer;user-select:none;
}
.search-box{flex:1}
.search-box input{
  width:100%;height:42px;
  border:1.5px solid rgba(168,85,247,.4);
  border-radius:14px;
  background:rgba(168,85,247,.12);
  color:#fff;padding:0 14px;outline:none;
  box-shadow:inset 0 1px rgba(255,255,255,.08);
}
.search-box input::placeholder{color:#b0a0c8}
.history-btn{
  height:42px;padding:0 13px;border-radius:14px;
  border:1.5px solid rgba(168,85,247,.5);
  background:linear-gradient(145deg,rgba(147,51,234,.55),rgba(88,28,135,.6));
  color:#f3e8ff;font-size:13px;
  box-shadow:0 5px 18px rgba(147,51,234,.4),inset 0 1px rgba(255,255,255,.2);
}

/* ===== MAIN ===== */
main{padding:14px;max-width:1200px;margin:0 auto}

/* HERO */
.hero{
  background:linear-gradient(145deg,rgba(168,85,247,.15),rgba(88,28,135,.18));
  border:1.5px solid rgba(168,85,247,.45);
  border-radius:22px;
  padding:16px 12px 18px;
  margin-bottom:20px;
  box-shadow:
    0 18px 45px rgba(100,30,180,.35),
    inset 0 1px rgba(255,255,255,.12),
    0 0 0 1px rgba(255,255,255,.05);
  backdrop-filter:blur(18px);
  position:relative;overflow:hidden;
}
.hero h1{font-size:19px;margin-bottom:4px;text-align:center}
.hero p{font-size:12px;color:#d0c0e8;margin-bottom:14px;text-align:center}

.featured-window{position:relative;margin:0 -4px}
.featured-track{
  display:flex;gap:14px;overflow-x:auto;
  scroll-snap-type:x mandatory;scroll-behavior:smooth;
  padding:12px 42px 16px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.featured-track::-webkit-scrollbar{display:none}

.featured-card{
  flex:0 0 155px;scroll-snap-align:center;
  border-radius:16px;overflow:hidden;position:relative;
  background:#1a0f2e;
  border:1.5px solid rgba(192,132,252,.45);
  box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.1);
  cursor:pointer;
  transition:transform .3s ease,opacity .3s,filter .3s;
  transform:scale(.87);opacity:.5;filter:brightness(.65) blur(.6px);
}
.featured-card.active{
  transform:scale(1.06);opacity:1;filter:brightness(1) blur(0);
  z-index:2;
  border-color:rgba(216,180,254,.8);
  box-shadow:0 20px 45px rgba(147,51,234,.55),0 0 0 2px rgba(216,180,254,.6),inset 0 1px rgba(255,255,255,.2);
}
.featured-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.featured-info{
  position:absolute;bottom:0;left:0;right:0;
  padding:28px 8px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.93));
  font-size:12px;text-align:center;
}
.featured-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:38px;height:38px;border:0;border-radius:50%;
  background:rgba(30,10,50,.8);color:#fff;
  border:1.5px solid rgba(192,132,252,.5);
  backdrop-filter:blur(12px);font-size:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.45);
}
.featured-arrow.right{right:6px}
.featured-arrow.left{left:6px}

/* SECTIONS */
.section{margin-top:24px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.section-head h2{font-size:15px}
.view-all{background:none;border:none;color:#d8b4fe;font-size:12px}

.movie-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.movie-row::-webkit-scrollbar{display:none}

.movie-card{
  flex:0 0 108px;border-radius:14px;overflow:hidden;
  background:rgba(168,85,247,.08);
  border:1.5px solid rgba(168,85,247,.35);
  box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.08);
  cursor:pointer;transition:transform .2s;
}
.movie-card:active{transform:scale(.96)}
.movie-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.movie-info{padding:7px}
.movie-info strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movie-meta{font-size:9px;color:#b0a0c0;margin-top:3px;display:flex;justify-content:space-between}
.rating{color:#fbbf24}

.full-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:11px;margin-top:12px}
.page{display:none}
.page.active{display:block}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:9px;left:50%;transform:translateX(-50%);
  width:calc(100% - 18px);max-width:430px;
  background:rgba(20,8,35,.85);
  backdrop-filter:blur(22px);
  border:1.5px solid rgba(168,85,247,.35);
  border-radius:20px;padding:6px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  box-shadow:0 12px 35px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.1);
}
.nav-item{
  background:none;border:none;color:#a090b8;
  padding:8px 3px;border-radius:15px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;
}
.nav-item.active{
  background:linear-gradient(135deg,rgba(168,85,247,.6),rgba(109,40,217,.55));
  color:#fff;
  box-shadow:inset 0 1px rgba(255,255,255,.2),0 5px 15px rgba(147,51,234,.35);
}
.nav-item span:first-child{font-size:18px}

/* ===== MODAL - طراحی خفن ===== */
.modal{position:fixed;inset:0;z-index:200;display:none;overflow:auto;background:#04020a}
.modal.show{display:block}

.modal-top{
  position:relative;height:300px;overflow:hidden;
}
.modal-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center top;
  filter:blur(22px) brightness(.38) saturate(1.2);
  transform:scale(1.15);
}
.modal-top-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,
    rgba(6,3,14,1) 0%,
    rgba(6,3,14,.7) 30%,
    rgba(6,3,14,.25) 60%,
    transparent 100%);
}
.modal-top-content{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:20px;
}
.modal-poster{
  width:135px;aspect-ratio:2/3;object-fit:cover;border-radius:16px;
  box-shadow:
    0 20px 50px rgba(0,0,0,.7),
    0 0 0 2px rgba(192,132,252,.5),
    0 0 30px rgba(168,85,247,.3);
  margin-bottom:10px;
}
.close{
  position:absolute;top:16px;left:16px;z-index:5;
  width:38px;height:38px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1.5px solid rgba(192,132,252,.4);
  color:#fff;font-size:20px;backdrop-filter:blur(10px);
}

.modal-body{
  background:rgba(14,6,28,.82);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1.5px solid rgba(168,85,247,.3);
  padding:8px 16px 55px;
  min-height:calc(100vh - 300px);
  margin-top:-1px;
}
.modal-body h2{
  text-align:center;font-size:22px;margin-bottom:6px;
  background:linear-gradient(90deg,#f0e0ff,#d8b4fe,#c084fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.modal-meta{text-align:center;color:#c0b0d8;font-size:12px;margin-bottom:14px}
.description{
  font-size:13.5px;line-height:1.9;color:#e0d5f0;
  background:rgba(168,85,247,.1);
  border:1px solid rgba(168,85,247,.25);
  border-radius:15px;padding:14px 15px;
}

.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:18px 0}
.btn{
  padding:12px 17px;border-radius:14px;border:none;color:#fff;font-size:13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  transition:transform .15s;
}
.btn:active{transform:scale(.96)}
.btn.play,.btn.download{
  background:linear-gradient(145deg,#c084fc,#7c3aed);
  border:1.5px solid rgba(216,180,254,.6);
  box-shadow:0 8px 22px rgba(147,51,234,.5),0 3px 0 #5b21b6,inset 0 1px rgba(255,255,255,.25);
  text-shadow:0 1px 2px rgba(0,0,0,.3);
}

.season-box,.episodes-box,.comments-box{
  background:rgba(168,85,247,.1);
  border:1px solid rgba(168,85,247,.28);
  border-radius:15px;padding:14px;margin:14px 0;
}
.season-box h3,.episodes-box h3,.comments-box h3{font-size:14px;margin-bottom:10px;color:#e9d5ff}
.season-grid,.episodes-grid{display:flex;flex-wrap:wrap;gap:8px}
.season-btn,.episode-btn{
  min-width:70px;padding:9px 12px;border-radius:11px;
  border:1.5px solid rgba(168,85,247,.4);
  background:rgba(147,51,234,.25);color:#e9d5ff;font-size:12px;
}
.season-btn.selected,.episode-btn.selected{
  background:linear-gradient(145deg,#a855f7,#6d28d9);
  border-color:rgba(216,180,254,.7);color:#fff;
  box-shadow:0 5px 15px rgba(147,51,234,.4);
}

.comment-form{display:flex;gap:8px;margin-bottom:11px}
.comment-form input{
  flex:1;height:42px;border-radius:12px;
  border:1.5px solid rgba(168,85,247,.3);
  background:rgba(168,85,247,.12);color:#fff;padding:0 13px;outline:none;
}
.comment-form button{
  padding:0 16px;border-radius:12px;border:none;
  background:linear-gradient(145deg,#a855f7,#6d28d9);color:#fff;
  box-shadow:0 4px 14px rgba(147,51,234,.4);
}

/* SETTINGS */
.settings-card{
  background:rgba(168,85,247,.1);
  border:1.5px solid rgba(168,85,247,.3);
  border-radius:17px;padding:16px;margin-bottom:13px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 25px rgba(80,20,150,.2);
}
.settings-card h3{font-size:14px;margin-bottom:6px;color:#e9d5ff}
.settings-card p{font-size:12px;color:#c0b0d8;line-height:1.65}

.toast{
  position:fixed;bottom:85px;left:50%;transform:translateX(-50%);
  background:rgba(30,10,50,.96);
  border:1.5px solid rgba(168,85,247,.4);
  padding:11px 18px;border-radius:14px;
  font-size:12px;opacity:0;transition:.25s;z-index:300;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
}
.toast.show{opacity:1}

.admin-box{
  background:rgba(168,85,247,.1);
  border:1.5px solid rgba(168,85,247,.35);
  border-radius:17px;padding:16px;margin-top:14px;
}
.admin-input{
  width:100%;margin-bottom:8px;padding:11px;
  border-radius:12px;border:1.5px solid rgba(168,85,247,.3);
  background:rgba(168,85,247,.12);color:#fff;outline:none;
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">HAMOFLIX</div>
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="جستجوی فیلم یا سریال...">
  </div>
  <button class="history-btn" onclick="toggleHistory()">🕘</button>
</header>

<main>
  <section id="homePage" class="page active">
    <div class="hero">
      <h1>به HAMOFLIX خوش اومدی 👋</h1>
      <p>دنیای فیلم و سریال مورد علاقه‌ات</p>
      <div class="featured-window">
        <button class="featured-arrow right" onclick="featuredMove(1)">‹</button>
        <div class="featured-track" id="featuredTrack"></div>
        <button class="featured-arrow left" onclick="featuredMove(-1)">›</button>
      </div>
    </div>
    <div id="homeSections"></div>
  </section>

  <section id="moviesPage" class="page">
    <h2 style="margin:8px 0 12px;font-size:18px">🎬 فیلم‌ها</h2>
    <div id="moviesGrid" class="full-grid"></div>
  </section>

  <section id="seriesPage" class="page">
    <h2 style="margin:8px 0 12px;font-size:18px">📺 سریال‌ها</h2>
    <div id="seriesGrid" class="full-grid"></div>
  </section>

  <section id="settingsPage" class="page">
    <h2 style="margin:8px 0 14px;font-size:18px">⚙️ تنظیمات</h2>
    <div id="settingsContent"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="homePage" onclick="openPage('homePage',this)">
    <span>⌂</span><span>خانه</span>
  </button>
  <button class="nav-item" data-page="moviesPage" onclick="openPage('moviesPage',this)">
    <span>🎬</span><span>فیلم‌ها</span>
  </button>
  <button class="nav-item" data-page="seriesPage" onclick="openPage('seriesPage',this)">
    <span>📺</span><span>سریال‌ها</span>
  </button>
  <button class="nav-item" data-page="settingsPage" onclick="openPage('settingsPage',this)">
    <span>⚙️</span><span>تنظیمات</span>
  </button>
</nav>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-top">
    <div class="modal-bg" id="modalBg"></div>
    <div class="modal-top-overlay"></div>
    <button class="close" onclick="hideModal()">×</button>
    <div class="modal-top-content">
      <img id="modalPoster" class="modal-poster" src="">
    </div>
  </div>

  <div class="modal-body">
    <h2 id="modalTitle"></h2>
    <div id="modalMeta" class="modal-meta"></div>
    <div id="modalDescription" class="description"></div>

    <div id="seasonBox" class="season-box" style="display:none">
      <h3>انتخاب فصل</h3>
      <div id="seasonGrid" class="season-grid"></div>
    </div>
    <div id="episodesBox" class="episodes-box" style="display:none">
      <h3>انتخاب قسمت</h3>
      <div id="episodesGrid" class="episodes-grid"></div>
    </div>

    <div class="actions">
      <button class="btn play" onclick="playMovie()">▶ پخش</button>
      <button class="btn download" onclick="downloadMovie()">⬇ دانلود</button>
      <button class="btn" id="favoriteBtn" onclick="toggleFavorite()">♡ علاقه‌مندی</button>
    </div>

    <div class="comments-box">
      <h3>💬 نظرات</h3>
      <div class="comment-form">
        <input id="commentInput" placeholder="نظرت رو بنویس...">
        <button onclick="addComment()">ارسال</button>
      </div>
      <div id="commentList"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const ADMIN_PASSWORD = "hamoxu";
const STORAGE_KEY = "hamo_v10";
const FAV_KEY = "hamo_fav_v10";
const HISTORY_KEY = "hamo_hist_v10";
const COMMENTS_KEY = "hamo_com_v10";
const FEATURED_KEY = "hamo_feat_v10";

const fallback = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect fill="#1a0f2e" width="100%" height="100%"/><text x="50%" y="50%" text-anchor="middle" fill="#c084fc" font-size="26">HAMOFLIX</text></svg>');

const defaultMovies = [
  {id:"1",title:"Wednesday",type:"series",genre:"فانتزی",year:"2022",rating:"8.1",poster:"https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg",description:"داستان ونزدی آدامز در مدرسه جدید.",isNew:true,seasons:2,episodesPerSeason:8},
  {id:"2",title:"Silo",type:"series",genre:"علمی تخیلی",year:"2023",rating:"8.1",poster:"https://image.tmdb.org/t/p/w500/1NxaSnba1QbbaZ6UVGqL9Y16k.jpg",description:"زندگی در سیلوی زیرزمینی.",isNew:true,seasons:2,episodesPerSeason:10},
  {id:"3",title:"The Last of Us",type:"series",genre:"درام",year:"2023",rating:"8.6",poster:"https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg",description:"سفر دو نفر در دنیای ویران‌شده.",isNew:true,seasons:2,episodesPerSeason:9},
  {id:"4",title:"Interstellar",type:"movie",genre:"علمی تخیلی",year:"2014",rating:"8.7",poster:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",description:"سفر میان‌ستاره‌ای برای نجات بشریت.",isNew:false},
  {id:"5",title:"Inception",type:"movie",genre:"علمی تخیلی",year:"2010",rating:"8.8",poster:"https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",description:"دزدی از ذهن انسان‌ها در رؤیا.",isNew:false},
  {id:"6",title:"Dune",type:"movie",genre:"علمی تخیلی",year:"2021",rating:"8.0",poster:"https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",description:"خاندان آتریدیس و سیاره شن.",isNew:true},
  {id:"7",title:"Stranger Things",type:"series",genre:"علمی تخیلی",year:"2016",rating:"8.6",poster:"https://image.tmdb.org/t/p/w500/x2LSRK2Cm7MZhjluni1msVJ3wDF.jpg",description:"ماجراهای ماورایی نوجوانان.",isNew:false,seasons:4,episodesPerSeason:8},
  {id:"8",title:"Breaking Bad",type:"series",genre:"جنایی",year:"2008",rating:"9.5",poster:"https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg",description:"معلم شیمی وارد دنیای جرم می‌شود.",isNew:false,seasons:5,episodesPerSeason:7},
  {id:"9",title:"Avatar",type:"movie",genre:"فانتزی",year:"2009",rating:"7.9",poster:"https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg",description:"سرباز در دنیای پاندورا.",isNew:false},
  {id:"10",title:"Dark",type:"series",genre:"معمایی",year:"2017",rating:"8.7",poster:"https://image.tmdb.org/t/p/w500/apbrbWs8M9lyOpJYU5WXrpFbk1Z.jpg",description:"راز زمان و ناپدید شدن یک کودک.",isNew:false,seasons:3,episodesPerSeason:10}
];

let movies=[], favorites=[], historyList=[], comments={}, featuredIds=["4","5","1","3","6"];
let currentMovie=null, selectedSeason=1, selectedEpisode=1, modalOpen=false;
let showingFavorites = false;

function loadData(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){const p=JSON.parse(s); if(Array.isArray(p)&&p.length) movies=p; else {movies=JSON.parse(JSON.stringify(defaultMovies)); localStorage.setItem(STORAGE_KEY,JSON.stringify(movies));}}
    else {movies=JSON.parse(JSON.stringify(defaultMovies)); localStorage.setItem(STORAGE_KEY,JSON.stringify(movies));}
  }catch(e){movies=JSON.parse(JSON.stringify(defaultMovies));}
  try{favorites=JSON.parse(localStorage.getItem(FAV_KEY)||"[]");}catch(e){favorites=[];}
  try{historyList=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");}catch(e){historyList=[];}
  try{comments=JSON.parse(localStorage.getItem(COMMENTS_KEY)||"{}");}catch(e){comments={};}
  try{const f=JSON.parse(localStorage.getItem(FEATURED_KEY)||"null"); if(Array.isArray(f)&&f.length) featuredIds=f;}catch(e){}
}
function saveMovies(){localStorage.setItem(STORAGE_KEY,JSON.stringify(movies));}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000);}
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function posterError(img){img.onerror=null;img.src=fallback;}

function openPage(id,btn){
  showingFavorites = false;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");

  if(id==="homePage") renderHome();
  if(id==="moviesPage") renderFull("movie","moviesGrid");
  if(id==="seriesPage") renderFull("series","seriesGrid");
  if(id==="settingsPage") renderSettings();
  window.scrollTo(0,0);
}

function card(m){
  return `<div class="movie-card" onclick="openMovie('${esc(m.id)}')">
    <img src="${esc(m.poster||fallback)}" onerror="posterError(this)" loading="lazy">
    <div class="movie-info"><strong>${esc(m.title)}</strong>
    <div class="movie-meta"><span>${esc(m.year||"")}</span><span class="rating">⭐ ${esc(m.rating||"—")}</span></div></div>
  </div>`;
}

function renderFeatured(){
  const track=document.getElementById("featuredTrack");
  let list=featuredIds.map(id=>movies.find(m=>String(m.id)===String(id))).filter(Boolean);
  if(list.length<5){
    const extra=movies.filter(m=>!list.find(x=>x.id===m.id)).slice(0,5-list.length);
    list=list.concat(extra);
  }
  const items=[...list,...list,...list];
  track.innerHTML=items.map(m=>`
    <div class="featured-card" data-id="\( {esc(m.id)}" onclick="openMovie(' \){esc(m.id)}')">
      <img src="${esc(m.poster||fallback)}" onerror="posterError(this)">
      <div class="featured-info"><strong>${esc(m.title)}</strong>⭐ ${esc(m.rating||"—")}</div>
    </div>`).join("");

  requestAnimationFrame(()=>{
    const cards=track.querySelectorAll(".featured-card");
    if(cards.length>5){
      const cardW=cards[0].offsetWidth+14;
      track.scrollLeft=cardW*list.length;
    }
    updateActiveCard();
  });
  track.onscroll=()=>updateActiveCard();
}

function updateActiveCard(){
  const track=document.getElementById("featuredTrack");
  const cards=[...track.querySelectorAll(".featured-card")];
  if(!cards.length) return;
  const trackRect=track.getBoundingClientRect();
  const center=trackRect.left+trackRect.width/2;
  let closest=null, minDist=Infinity;
  cards.forEach(card=>{
    const r=card.getBoundingClientRect();
    const dist=Math.abs(center-(r.left+r.width/2));
    if(dist<minDist){minDist=dist;closest=card;}
  });
  cards.forEach(c=>c.classList.remove("active"));
  if(closest) closest.classList.add("active");
}

function featuredMove(dir){
  const track=document.getElementById("featuredTrack");
  const card=track.querySelector(".featured-card");
  if(!card) return;
  track.scrollBy({left:dir*(card.offsetWidth+14), behavior:"smooth"});
}

function renderHome(){
  if(showingFavorites) return;
  renderFeatured();
  const box=document.getElementById("homeSections");
  const sections=[
    {title:"🔥 فیلم‌های جدید",filter:m=>m.type==="movie"&&m.isNew},
    {title:"📺 سریال‌های جدید",filter:m=>m.type==="series"&&m.isNew},
    {title:"📺 سریال‌ها",filter:m=>m.type==="series"},
    {title:"🎬 فیلم‌ها",filter:m=>m.type==="movie"},
    {title:"⭐ محبوب‌ترین‌ها",filter:m=>true,sort:(a,b)=>Number(b.rating)-Number(a.rating)}
  ];
  let html="";
  sections.forEach((s,i)=>{
    let items=movies.filter(s.filter);
    if(s.sort) items.sort(s.sort);
    items=items.slice(0,8);
    if(!items.length) return;
    html+=`<div class="section"><div class="section-head"><h2>${s.title}</h2>
      <button class="view-all" onclick="openSection(${i})">مشاهده همه</button></div>
      <div class="movie-row">${items.map(card).join("")}</div></div>`;
  });
  box.innerHTML=html||"<p style='text-align:center;color:#888;padding:30px'>محتوایی نیست</p>";
}

function openSection(i){
  if(i===2){document.querySelector('[data-page="seriesPage"]').click();return;}
  if(i===3){document.querySelector('[data-page="moviesPage"]').click();return;}
  document.querySelector('[data-page="moviesPage"]').click();
}
function renderFull(type,id){
  const list=movies.filter(m=>m.type===type).sort((a,b)=>Number(b.rating)-Number(a.rating));
  document.getElementById(id).innerHTML=list.map(card).join("")||"<p style='color:#888'>موردی نیست</p>";
}

function openMovie(id){
  const m=movies.find(x=>String(x.id)===String(id));
  if(!m) return;
  currentMovie=m; selectedSeason=1; selectedEpisode=1;
  historyList=historyList.filter(x=>x!==String(id));
  historyList.unshift(String(id));
  if(historyList.length>15) historyList.length=15;
  localStorage.setItem(HISTORY_KEY,JSON.stringify(historyList));

  document.getElementById("modalBg").style.backgroundImage=`url('${m.poster||fallback}')`;
  document.getElementById("modalPoster").src=m.poster||fallback;
  document.getElementById("modalTitle").textContent=m.title;
  document.getElementById("modalMeta").textContent=`${m.type==="movie"?"فیلم":"سریال"} · ${m.year||""} · ${m.genre||""} · ⭐ ${m.rating||"—"}`;
  document.getElementById("modalDescription").textContent=m.description||"توضیحی ثبت نشده";

  const seasonBox=document.getElementById("seasonBox");
  const epBox=document.getElementById("episodesBox");
  if(m.type==="series"){
    const seasons=m.seasons||1;
    seasonBox.style.display="block";
    let sHtml="";
    for(let i=1;i<=seasons;i++) sHtml+=`<button class="season-btn \( {i===1?"selected":""}" onclick="selectSeason( \){i})">فصل ${i}</button>`;
    document.getElementById("seasonGrid").innerHTML=sHtml;
    renderEpisodes();
    epBox.style.display="block";
  }else{seasonBox.style.display="none";epBox.style.display="none";}

  updateFavBtn(); renderComments();
  document.getElementById("modal").classList.add("show");
  modalOpen=true;
  history.pushState({modal:1},"");
}
function selectSeason(n){selectedSeason=n;selectedEpisode=1;document.querySelectorAll(".season-btn").forEach((b,i)=>b.classList.toggle("selected",i+1===n));renderEpisodes();toast("فصل "+n+" انتخاب شد");}
function renderEpisodes(){
  const count=currentMovie.episodesPerSeason||8;
  let html="";
  for(let i=1;i<=count;i++) html+=`<button class="episode-btn \( {i===selectedEpisode?"selected":""}" onclick="selectEpisode( \){i})">قسمت ${i}</button>`;
  document.getElementById("episodesGrid").innerHTML=html;
}
function selectEpisode(n){selectedEpisode=n;document.querySelectorAll(".episode-btn").forEach((b,i)=>b.classList.toggle("selected",i+1===n));toast("قسمت "+n+" انتخاب شد");}
function hideModal(){document.getElementById("modal").classList.remove("show");modalOpen=false;currentMovie=null;}
window.addEventListener("popstate",()=>{if(modalOpen) hideModal();});

function playMovie(){if(!currentMovie)return; toast(currentMovie.type==="series"?`پخش فصل ${selectedSeason} - قسمت ${selectedEpisode}`:"در حال پخش...");}
function downloadMovie(){if(!currentMovie)return; toast(currentMovie.type==="series"?`دانلود فصل ${selectedSeason} - قسمت ${selectedEpisode}`:"دانلود شروع شد");}

function updateFavBtn(){const a=favorites.includes(String(currentMovie.id));document.getElementById("favoriteBtn").textContent=a?"♥ حذف از علاقه‌مندی":"♡ علاقه‌مندی";}
function toggleFavorite(){
  if(!currentMovie)return;
  const id=String(currentMovie.id);
  if(favorites.includes(id)){favorites=favorites.filter(x=>x!==id);toast("از علاقه‌مندی‌ها حذف شد");}
  else{favorites.push(id);toast("به علاقه‌مندی‌ها اضافه شد ❤️");}
  localStorage.setItem(FAV_KEY,JSON.stringify(favorites));
  updateFavBtn();
}

function renderComments(){
  const list=comments[String(currentMovie.id)]||[];
  document.getElementById("commentList").innerHTML=list.length
    ?list.map(c=>`<div style="background:rgba(168,85,247,.12);padding:10px;border-radius:11px;margin-bottom:7px;font-size:12px;border:1px solid rgba(168,85,247,.2)">
      <div style="color:#c0b0d8;font-size:10px;margin-bottom:4px">کاربر · \( {new Date(c.date).toLocaleDateString("fa-IR")}</div> \){esc(c.text)}</div>`).join("")
    :"<div style='color:#a090b8;font-size:12px;text-align:center'>هنوز نظری نیست</div>";
}
function addComment(){
  if(!currentMovie)return;
  const input=document.getElementById("commentInput");
  const text=input.value.trim(); if(!text)return;
  const id=String(currentMovie.id);
  if(!comments[id]) comments[id]=[];
  comments[id].unshift({text,date:Date.now()});
  localStorage.setItem(COMMENTS_KEY,JSON.stringify(comments));
  input.value=""; renderComments(); toast("نظر ثبت شد");
}

function toggleHistory(){
  if(!historyList.length){toast("تاریخچه‌ای نیست");return;}
  const items=historyList.map(id=>movies.find(m=>String(m.id)===id)).filter(Boolean);
  alert("تاریخچه اخیر:\n\n"+items.map(m=>m.title).join("\n"));
}

function renderSettings(){
  const favCount=favorites.length;
  document.getElementById("settingsContent").innerHTML=`
    <div class="settings-card">
      <h3>❤️ علاقه‌مندی‌های من</h3>
      <p>${favCount ? favCount+" مورد ذخیره کردی" : "هنوز چیزی ذخیره نکردی"}</p>
      <button class="btn play" style="margin-top:10px;width:100%" onclick="showFavorites()">مشاهده علاقه‌مندی‌ها</button>
    </div>
    <div class="settings-card">
      <h3>ℹ️ درباره سازنده</h3>
      <p>این سایت توسط <strong style="color:#d8b4fe">HAMO</strong> ساخته شده. هدفش اینه که راحت فیلم و سریال مورد علاقه‌ت رو پیدا کنی و ازش لذت ببری. اگر پیشنهادی داری از بخش گزارش بفرست ❤️</p>
    </div>
    <div class="settings-card">
      <h3>⚠ گزارش مشکل</h3>
      <p>اگر باگ یا مشکلی دیدی بهم بگو</p>
      <button class="btn" style="margin-top:8px" onclick="report()">ارسال گزارش</button>
    </div>`;
}

function showFavorites(){
  showingFavorites = true;
  const list = movies.filter(m => favorites.includes(String(m.id)));
  
  // برو به صفحه خانه
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("homePage").classList.add("active");
  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
  document.querySelector('[data-page="homePage"]').classList.add("active");

  const box = document.getElementById("homeSections");
  if(list.length){
    box.innerHTML = `
      <div class="section">
        <div class="section-head">
          <h2>❤️ علاقه‌مندی‌های من</h2>
          <button class="view-all" onclick="backFromFavorites()">بازگشت</button>
        </div>
        <div class="movie-row">${list.map(card).join("")}</div>
      </div>`;
  } else {
    box.innerHTML = `
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:40px;margin-bottom:12px">💔</div>
        <p style="color:#a090b8;margin-bottom:16px">هنوز فیلمی به علاقه‌مندی‌ها اضافه نکردی</p>
        <button class="btn play" onclick="backFromFavorites()">بازگشت به خانه</button>
      </div>`;
  }
  // مخفی کردن هیرو وقتی علاقه‌مندی‌ها بازه
  document.querySelector(".hero").style.display = "none";
  window.scrollTo(0,0);
}

function backFromFavorites(){
  showingFavorites = false;
  document.querySelector(".hero").style.display = "block";
  renderHome();
}

function report(){const t=prompt("مشکل را بنویس:"); if(t) toast("گزارش ثبت شد ❤️");}

/* ADMIN */
let clicks=0;
document.getElementById("logo").onclick=function(){
  clicks++; clearTimeout(window.clk); window.clk=setTimeout(()=>clicks=0,1600);
  if(clicks>=5){clicks=0; const p=prompt("رمز ادمین:"); if(p===ADMIN_PASSWORD){openAdmin();toast("ورود موفق");} else if(p!==null) toast("رمز اشتباه");}
};
function openAdmin(){
  openPage("settingsPage",document.querySelector('[data-page="settingsPage"]'));
  document.getElementById("settingsContent").innerHTML=`
    <div class="admin-box">
      <h3>🛠 پنل مدیریت</h3>
      <div style="max-height:200px;overflow:auto;margin:10px 0">
        ${movies.map(m=>`<div style="display:flex;align-items:center;gap:8px;padding:6px;background:rgba(168,85,247,.12);border-radius:8px;margin-bottom:4px">
          <img src="${esc(m.poster||fallback)}" style="width:30px;height:42px;object-fit:cover;border-radius:4px" onerror="posterError(this)">
          <span style="flex:1;font-size:12px">${esc(m.title)}</span>
          <button onclick="editMovie('${esc(m.id)}')" style="padding:4px 8px;font-size:11px;border-radius:6px;border:1px solid #c084fc;background:rgba(168,85,247,.25);color:#e9d5ff">ویرایش</button>
        </div>`).join("")}
      </div>
      <h4 id="formTitle" style="margin:10px 0 8px">➕ افزودن جدید</h4>
      <input class="admin-input" id="aTitle" placeholder="نام">
      <select class="admin-input" id="aType"><option value="movie">فیلم</option><option value="series">سریال</option></select>
      <input class="admin-input" id="aGenre" placeholder="ژانر">
      <input class="admin-input" id="aYear" placeholder="سال">
      <input class="admin-input" id="aRating" placeholder="امتیاز">
      <input class="admin-input" id="aPoster" placeholder="لینک پوستر">
      <input class="admin-input" id="aSeasons" placeholder="تعداد فصل (سریال)">
      <input class="admin-input" id="aEpisodes" placeholder="قسمت در هر فصل">
      <textarea class="admin-input" id="aDesc" rows="2" placeholder="توضیحات"></textarea>
      <button class="btn play" style="width:100%;margin-top:6px" onclick="saveAdmin()">ذخیره</button>
      <button class="btn" style="width:100%;margin-top:6px" onclick="renderSettings()">بستن</button>
    </div>`;
  window.editingId=null;
}
function editMovie(id){
  const m=movies.find(x=>String(x.id)===String(id)); if(!m) return;
  window.editingId=id;
  document.getElementById("formTitle").textContent="✏️ ویرایش: "+m.title;
  document.getElementById("aTitle").value=m.title||"";
  document.getElementById("aType").value=m.type||"movie";
  document.getElementById("aGenre").value=m.genre||"";
  document.getElementById("aYear").value=m.year||"";
  document.getElementById("aRating").value=m.rating||"";
  document.getElementById("aPoster").value=m.poster||"";
  document.getElementById("aSeasons").value=m.seasons||"";
  document.getElementById("aEpisodes").value=m.episodesPerSeason||"";
  document.getElementById("aDesc").value=m.description||"";
  toast("در حال ویرایش");
}
function saveAdmin(){
  const title=document.getElementById("aTitle").value.trim(); if(!title){toast("نام را وارد کن");return;}
  const data={title,type:document.getElementById("aType").value,genre:document.getElementById("aGenre").value.trim()||"عمومی",
    year:document.getElementById("aYear").value.trim(),rating:document.getElementById("aRating").value.trim()||"0",
    poster:document.getElementById("aPoster").value.trim()||fallback,description:document.getElementById("aDesc").value.trim(),isNew:true};
  if(data.type==="series"){data.seasons=parseInt(document.getElementById("aSeasons").value)||1; data.episodesPerSeason=parseInt(document.getElementById("aEpisodes").value)||8;}
  if(window.editingId){const i=movies.findIndex(m=>String(m.id)===String(window.editingId)); if(i>-1) movies[i]={...movies[i],...data}; toast("ویرایش شد");}
  else{data.id=String(Date.now()); movies.unshift(data); toast("اضافه شد");}
  saveMovies(); renderHome(); openAdmin();
}

renderHome();

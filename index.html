<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0615">
<title>HAMOFLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:#08050e;
  color:#fff;
  min-height:100vh;
  padding-bottom:90px;
}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(8,5,14,.9);
  backdrop-filter:blur(12px);
  padding:12px 14px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.logo{
  font-size:18px;font-weight:900;
  color:#fff;cursor:pointer;
  text-shadow:0 0 15px rgba(165,90,255,.7);
}
.search-box{flex:1}
.search-box input{
  width:100%;height:40px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  background:rgba(255,255,255,.08);
  color:#fff;padding:0 12px;outline:none;
}
.history-btn{
  height:40px;padding:0 12px;
  border-radius:12px;border:1px solid rgba(170,110,255,.4);
  background:rgba(120,50,200,.3);color:#e0c0ff;font-size:12px;
}
main{padding:14px;max-width:1200px;margin:0 auto}
.hero{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(170,110,255,.3);
  border-radius:18px;padding:14px;margin-bottom:16px;
}
.hero h1{font-size:18px;margin-bottom:6px}
.hero p{font-size:12px;color:#aaa}
.featured-track{
  display:flex;gap:10px;overflow-x:auto;
  padding:10px 0 6px;scrollbar-width:none;
}
.featured-track::-webkit-scrollbar{display:none}
.featured-card{
  flex:0 0 120px;border-radius:12px;overflow:hidden;
  background:#1a1225;cursor:pointer;
  border:1px solid rgba(255,255,255,.08);
}
.featured-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.featured-info{
  position:absolute;bottom:0;left:0;right:0;
  padding:20px 6px 6px;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  font-size:11px;
}
.section{margin-top:22px}
.section-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:10px;
}
.section-head h2{font-size:15px}
.view-all{background:none;border:none;color:#b983ff;font-size:12px}
.movie-row{
  display:flex;gap:9px;overflow-x:auto;
  padding-bottom:6px;scrollbar-width:none;
}
.movie-row::-webkit-scrollbar{display:none}
.movie-card{
  flex:0 0 105px;border-radius:11px;overflow:hidden;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);cursor:pointer;
}
.movie-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.movie-info{padding:6px}
.movie-info strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movie-meta{font-size:9px;color:#999;margin-top:3px;display:flex;justify-content:space-between}
.rating{color:#ffc94d}
.bottom-nav{
  position:fixed;bottom:8px;left:50%;transform:translateX(-50%);
  width:calc(100% - 20px);max-width:420px;
  background:rgba(22,12,35,.85);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;padding:6px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
.nav-item{
  background:none;border:none;color:#aaa;
  padding:8px 4px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;
}
.nav-item.active{
  background:linear-gradient(135deg,rgba(135,57,222,.5),rgba(75,24,130,.4));
  color:#fff;
}
.nav-item span:first-child{font-size:18px}
.page{display:none}
.page.active{display:block}
.full-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
  gap:10px;margin-top:12px;
}
.modal{
  position:fixed;inset:0;z-index:200;
  background:#000;display:none;overflow:auto;
}
.modal.show{display:block}
.modal-bg{
  position:fixed;inset:0;
  background-size:cover;background-position:center;
  filter:blur(20px) brightness(.35);transform:scale(1.1);
}
.modal-content{
  position:relative;z-index:2;
  padding:20px 16px 40px;max-width:600px;margin:0 auto;
}
.modal-poster{
  width:130px;aspect-ratio:2/3;object-fit:cover;
  border-radius:14px;display:block;margin:0 auto 14px;
  box-shadow:0 15px 40px rgba(0,0,0,.6);
}
.close{
  position:fixed;top:14px;left:14px;z-index:10;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:20px;
}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.btn{
  padding:10px 16px;border-radius:12px;border:none;color:#fff;font-size:13px;
  background:rgba(255,255,255,.1);
}
.btn.play,.btn.download{
  background:linear-gradient(145deg,#a855f7,#6b21a8);
  box-shadow:0 4px 12px rgba(120,50,200,.4);
}
.episodes-box,.comments-box{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:12px;margin:14px 0;
}
.episodes-grid{display:flex;flex-wrap:wrap;gap:6px}
.episode-btn{
  padding:7px 12px;border-radius:9px;
  border:1px solid rgba(170,110,255,.3);
  background:rgba(120,50,200,.2);color:#e0c0ff;font-size:12px;
}
.episode-btn.selected{background:linear-gradient(145deg,#9b4dff,#5a1a9e);color:#fff}
.comment-form{display:flex;gap:6px;margin-bottom:10px}
.comment-form input{
  flex:1;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:#fff;padding:0 10px;outline:none;
}
.comment-form button{
  padding:0 14px;border-radius:10px;border:none;
  background:linear-gradient(145deg,#9b4dff,#5a1a9e);color:#fff;
}
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(30,15,45,.95);padding:10px 16px;border-radius:12px;
  font-size:12px;opacity:0;transition:.25s;z-index:300;
  border:1px solid rgba(255,255,255,.1);
}
.toast.show{opacity:1}
.admin-box{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:14px;margin-top:16px;
}
.admin-input{
  width:100%;margin-bottom:8px;padding:10px;
  border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);color:#fff;outline:none;
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">HAMOFLIX</div>
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="جستجوی فیلم یا سریال...">
  </div>
  <button class="history-btn" onclick="toggleHistory()">🕘</button>
</header>

<main>
  <section id="homePage" class="page active">
    <div class="hero">
      <h1>به HAMOFLIX خوش اومدی 👋</h1>
      <p>دنیای فیلم و سریال مورد علاقه‌ات</p>
      <div class="featured-track" id="featuredTrack"></div>
    </div>
    <div id="homeSections"></div>
  </section>

  <section id="moviesPage" class="page">
    <h2 style="margin:10px 0">🎬 فیلم‌ها</h2>
    <div id="moviesGrid" class="full-grid"></div>
  </section>

  <section id="seriesPage" class="page">
    <h2 style="margin:10px 0">📺 سریال‌ها</h2>
    <div id="seriesGrid" class="full-grid"></div>
  </section>

  <section id="settingsPage" class="page">
    <h2 style="margin:10px 0">⚙️ تنظیمات</h2>
    <div id="settingsContent"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="homePage" onclick="openPage('homePage',this)">
    <span>⌂</span><span>خانه</span>
  </button>
  <button class="nav-item" data-page="moviesPage" onclick="openPage('moviesPage',this)">
    <span>🎬</span><span>فیلم‌ها</span>
  </button>
  <button class="nav-item" data-page="seriesPage" onclick="openPage('seriesPage',this)">
    <span>📺</span><span>سریال‌ها</span>
  </button>
  <button class="nav-item" data-page="settingsPage" onclick="openPage('settingsPage',this)">
    <span>⚙️</span><span>تنظیمات</span>
  </button>
</nav>

<div id="modal" class="modal">
  <div class="modal-bg" id="modalBg"></div>
  <button class="close" onclick="hideModal()">×</button>
  <div class="modal-content">
    <img id="modalPoster" class="modal-poster" src="">
    <h2 id="modalTitle" style="text-align:center;margin-bottom:6px"></h2>
    <div id="modalMeta" style="text-align:center;color:#aaa;font-size:12px;margin-bottom:12px"></div>
    <div id="modalDescription" style="font-size:13px;line-height:1.8;color:#ddd;background:rgba(255,255,255,.05);padding:12px;border-radius:12px"></div>
    
    <div id="episodesBox" class="episodes-box" style="display:none">
      <h3 style="font-size:14px;margin-bottom:8px">انتخاب قسمت</h3>
      <div id="episodesGrid" class="episodes-grid"></div>
    </div>

    <div class="actions">
      <button class="btn play" onclick="playMovie()">▶ پخش</button>
      <button class="btn download" onclick="downloadMovie()">⬇ دانلود</button>
      <button class="btn" id="favoriteBtn" onclick="toggleFavorite()">♡ علاقه‌مندی</button>
    </div>

    <div class="comments-box">
      <h3 style="font-size:14px;margin-bottom:8px">💬 نظرات</h3>
      <div class="comment-form">
        <input id="commentInput" placeholder="نظرت رو بنویس...">
        <button onclick="addComment()">ارسال</button>
      </div>
      <div id="commentList"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const ADMIN_PASSWORD = "hamoxu";
const STORAGE_KEY = "hamo_v7";
const FAV_KEY = "hamo_fav_v7";
const HISTORY_KEY = "hamo_hist_v7";
const COMMENTS_KEY = "hamo_com_v7";
const FEATURED_KEY = "hamo_feat_v7";

const fallback = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect fill="#1a1225" width="100%" height="100%"/><text x="50%" y="50%" text-anchor="middle" fill="#a96cff" font-size="28">HAMOFLIX</text></svg>');

const defaultMovies = [
  {id:"1",title:"Wednesday",type:"series",genre:"فانتزی",year:"2022",rating:"8.1",poster:"https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg",description:"داستان ونزدی آدامز",isNew:true,episodes:8},
  {id:"2",title:"Silo",type:"series",genre:"علمی تخیلی",year:"2023",rating:"8.1",poster:"https://image.tmdb.org/t/p/w500/1NxaSnba1QbbaZ6UVGqL9Y16k.jpg",description:"زندگی در سیلو",isNew:true,episodes:10},
  {id:"3",title:"The Last of Us",type:"series",genre:"درام",year:"2023",rating:"8.6",poster:"https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg",description:"سفر در دنیای ویران",isNew:true,episodes:9},
  {id:"4",title:"Interstellar",type:"movie",genre:"علمی تخیلی",year:"2014",rating:"8.7",poster:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",description:"سفر میان‌ستاره‌ای",isNew:false},
  {id:"5",title:"Inception",type:"movie",genre:"علمی تخیلی",year:"2010",rating:"8.8",poster:"https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",description:"دزدی از ذهن",isNew:false},
  {id:"6",title:"Dune",type:"movie",genre:"علمی تخیلی",year:"2021",rating:"8.0",poster:"https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",description:"سیاره شن",isNew:true},
  {id:"7",title:"Stranger Things",type:"series",genre:"علمی تخیلی",year:"2016",rating:"8.6",poster:"https://image.tmdb.org/t/p/w500/x2LSRK2Cm7MZhjluni1msVJ3wDF.jpg",description:"ماجراهای ماورایی",isNew:false,episodes:8},
  {id:"8",title:"Breaking Bad",type:"series",genre:"جنایی",year:"2008",rating:"9.5",poster:"https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg",description:"معلم شیمی",isNew:false,episodes:7},
  {id:"9",title:"Avatar",type:"movie",genre:"فانتزی",year:"2009",rating:"7.9",poster:"https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg",description:"پاندورا",isNew:false},
  {id:"10",title:"Dark",type:"series",genre:"معمایی",year:"2017",rating:"8.7",poster:"https://image.tmdb.org/t/p/w500/apbrbWs8M9lyOpJYU5WXrpFbk1Z.jpg",description:"راز زمان",isNew:false,episodes:10}
];

let movies = [];
let favorites = [];
let historyList = [];
let comments = {};
let featuredIds = ["4","5","1","3","6"];
let currentMovie = null;
let selectedEpisode = 1;
let modalOpen = false;

function loadData(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const p = JSON.parse(saved);
      if(Array.isArray(p) && p.length) movies = p;
      else movies = JSON.parse(JSON.stringify(defaultMovies));
    } else {
      movies = JSON.parse(JSON.stringify(defaultMovies));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    }
  }catch(e){
    movies = JSON.parse(JSON.stringify(defaultMovies));
  }

  try{ favorites = JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); }catch(e){ favorites = []; }
  try{ historyList = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }catch(e){ historyList = []; }
  try{ comments = JSON.parse(localStorage.getItem(COMMENTS_KEY) || "{}"); }catch(e){ comments = {}; }
  try{ 
    const f = JSON.parse(localStorage.getItem(FEATURED_KEY) || "null");
    if(Array.isArray(f) && f.length) featuredIds = f;
  }catch(e){}
}

function saveMovies(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(movies)); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

function esc(t){ return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function posterError(img){ img.onerror=null; img.src=fallback; }

function openPage(id, btn){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
  if(btn) btn.classList.add("active");

  if(id === "moviesPage") renderFull("movie", "moviesGrid");
  if(id === "seriesPage") renderFull("series", "seriesGrid");
  if(id === "settingsPage") renderSettings();
  window.scrollTo(0,0);
}

function card(m){
  const fav = favorites.includes(String(m.id));
  return `<div class="movie-card" onclick="openMovie('${esc(m.id)}')">
    <img src="${esc(m.poster||fallback)}" onerror="posterError(this)" loading="lazy">
    <div class="movie-info">
      <strong>${esc(m.title)}</strong>
      <div class="movie-meta"><span>${esc(m.year||"")}</span><span class="rating">⭐ ${esc(m.rating||"—")}</span></div>
    </div>
  </div>`;
}

function renderFeatured(){
  const track = document.getElementById("featuredTrack");
  let list = featuredIds.map(id => movies.find(m => String(m.id)===String(id))).filter(Boolean);
  if(list.length < 5){
    const extra = movies.filter(m => !list.find(x => x.id===m.id)).slice(0,5-list.length);
    list = list.concat(extra);
  }
  track.innerHTML = list.map(m => `
    <div class="featured-card" style="position:relative" onclick="openMovie('${esc(m.id)}')">
      <img src="${esc(m.poster||fallback)}" onerror="posterError(this)">
      <div class="featured-info"><strong>${esc(m.title)}</strong><br>⭐ ${esc(m.rating||"—")}</div>
    </div>
  `).join("");
}

function renderHome(){
  renderFeatured();
  const box = document.getElementById("homeSections");
  const sections = [
    {title:"🔥 فیلم‌های جدید", filter:m => m.type==="movie" && m.isNew},
    {title:"📺 سریال‌های جدید", filter:m => m.type==="series" && m.isNew},
    {title:"📺 سریال‌ها", filter:m => m.type==="series"},
    {title:"🎬 فیلم‌ها", filter:m => m.type==="movie"},
    {title:"⭐ محبوب‌ترین‌ها", filter:m => true, sort:(a,b)=>Number(b.rating)-Number(a.rating)}
  ];
  let html = "";
  sections.forEach((s,i) => {
    let items = movies.filter(s.filter);
    if(s.sort) items.sort(s.sort);
    items = items.slice(0,8);
    if(!items.length) return;
    html += `<div class="section">
      <div class="section-head">
        <h2>${s.title}</h2>
        <button class="view-all" onclick="openSection(${i})">مشاهده همه</button>
      </div>
      <div class="movie-row">${items.map(card).join("")}</div>
    </div>`;
  });
  box.innerHTML = html || "<p style='text-align:center;color:#888;padding:30px'>محتوایی نیست</p>";
}

function openSection(i){
  if(i===2){ document.querySelector('[data-page="seriesPage"]').click(); return; }
  if(i===3){ document.querySelector('[data-page="moviesPage"]').click(); return; }
  document.querySelector('[data-page="moviesPage"]').click();
}

function renderFull(type, id){
  const list = movies.filter(m => m.type===type).sort((a,b)=>Number(b.rating)-Number(a.rating));
  document.getElementById(id).innerHTML = list.map(card).join("") || "<p style='color:#888'>موردی نیست</p>";
}

function openMovie(id){
  const m = movies.find(x => String(x.id)===String(id));
  if(!m) return;
  currentMovie = m;
  selectedEpisode = 1;

  // تاریخچه
  historyList = historyList.filter(x => x !== String(id));
  historyList.unshift(String(id));
  if(historyList.length>15) historyList.length=15;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(historyList));

  document.getElementById("modalBg").style.backgroundImage = `url('${m.poster||fallback}')`;
  document.getElementById("modalPoster").src = m.poster||fallback;
  document.getElementById("modalTitle").textContent = m.title;
  document.getElementById("modalMeta").textContent = `${m.type==="movie"?"فیلم":"سریال"} · ${m.year||""} · ${m.genre||""} · ⭐ ${m.rating||"—"}`;
  document.getElementById("modalDescription").textContent = m.description || "توضیحی ثبت نشده";

  // قسمت‌ها
  const epBox = document.getElementById("episodesBox");
  if(m.type==="series"){
    epBox.style.display="block";
    let epHtml="";
    for(let i=1;i<=(m.episodes||8);i++){
      epHtml += `<button class="episode-btn \( {i===1?"selected":""}" onclick="selectEp( \){i})">قسمت ${i}</button>`;
    }
    document.getElementById("episodesGrid").innerHTML = epHtml;
  } else {
    epBox.style.display="none";
  }

  updateFavBtn();
  renderComments();
  document.getElementById("modal").classList.add("show");
  modalOpen = true;
  history.pushState({modal:1},"");
}

function selectEp(n){
  selectedEpisode = n;
  document.querySelectorAll(".episode-btn").forEach((b,i) => b.classList.toggle("selected", i+1===n));
  toast("قسمت " + n + " انتخاب شد");
}

function hideModal(){
  document.getElementById("modal").classList.remove("show");
  modalOpen = false;
  currentMovie = null;
}

window.addEventListener("popstate", () => {
  if(modalOpen) hideModal();
});

function playMovie(){
  if(!currentMovie) return;
  toast(currentMovie.type==="series" ? `پخش قسمت ${selectedEpisode}` : "در حال پخش...");
}
function downloadMovie(){
  if(!currentMovie) return;
  toast("دانلود شروع شد");
}

function updateFavBtn(){
  const active = favorites.includes(String(currentMovie.id));
  document.getElementById("favoriteBtn").textContent = active ? "♥ حذف" : "♡ علاقه‌مندی";
}
function toggleFavorite(){
  if(!currentMovie) return;
  const id = String(currentMovie.id);
  if(favorites.includes(id)){
    favorites = favorites.filter(x=>x!==id);
    toast("حذف شد");
  } else {
    favorites.push(id);
    toast("اضافه شد");
  }
  localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
  updateFavBtn();
  renderHome();
}

function renderComments(){
  const list = comments[String(currentMovie.id)] || [];
  document.getElementById("commentList").innerHTML = list.length 
    ? list.map(c => `<div style="background:rgba(255,255,255,.05);padding:8px;border-radius:8px;margin-bottom:6px;font-size:12px">
        <div style="color:#aaa;font-size:10px;margin-bottom:3px">کاربر · ${new Date(c.date).toLocaleDateString("fa-IR")}</div>
        ${esc(c.text)}
      </div>`).join("")
    : "<div style='color:#888;font-size:12px;text-align:center'>هنوز نظری نیست</div>";
}
function addComment(){
  if(!currentMovie) return;
  const input = document.getElementById("commentInput");
  const text = input.value.trim();
  if(!text) return;
  const id = String(currentMovie.id);
  if(!comments[id]) comments[id]=[];
  comments[id].unshift({text, date:Date.now()});
  localStorage.setItem(COMMENTS_KEY, JSON.stringify(comments));
  input.value="";
  renderComments();
  toast("نظر ثبت شد");
}

function toggleHistory(){
  if(!historyList.length){ toast("تاریخچه‌ای نیست"); return; }
  const items = historyList.map(id => movies.find(m=>String(m.id)===id)).filter(Boolean);
  let msg = items.map(m => m.title).join("\n");
  alert("تاریخچه:\n\n" + msg);
}

function renderSettings(){
  document.getElementById("settingsContent").innerHTML = `
    <div style="background:rgba(255,255,255,.05);padding:14px;border-radius:12px;margin-bottom:10px">
      <strong>علاقه‌مندی‌ها</strong>
      <button class="btn" style="margin-top:8px" onclick="showFavs()">مشاهده</button>
    </div>
    <div style="background:rgba(255,255,255,.05);padding:14px;border-radius:12px">
      <strong>گزارش مشکل</strong>
      <button class="btn" style="margin-top:8px" onclick="report()">گزارش</button>
    </div>
  `;
}
function showFavs(){
  const list = movies.filter(m => favorites.includes(String(m.id)));
  document.getElementById("homeSections").innerHTML = list.length
    ? `<div class="section"><h2>❤️ علاقه‌مندی‌ها</h2><div class="movie-row">${list.map(card).join("")}</div></div>`
    : "<p style='text-align:center;color:#888;padding:20px'>چیزی ذخیره نکردی</p>";
  openPage("homePage", document.querySelector('[data-page="homePage"]'));
}
function report(){
  const t = prompt("مشکل را بنویس:");
  if(t) toast("گزارش ثبت شد");
}

/* ADMIN */
let clicks = 0;
document.getElementById("logo").onclick = function(){
  clicks++;
  clearTimeout(window.clk);
  window.clk = setTimeout(()=>clicks=0, 1600);
  if(clicks >= 5){
    clicks=0;
    const p = prompt("رمز ادمین:");
    if(p === ADMIN_PASSWORD){
      openAdmin();
      toast("ورود موفق");
    } else if(p!==null) toast("رمز اشتباه");
  }
};

function openAdmin(){
  openPage("settingsPage", document.querySelector('[data-page="settingsPage"]'));
  document.getElementById("settingsContent").innerHTML = `
    <div class="admin-box">
      <h3>🛠 پنل مدیریت</h3>
      <p style="font-size:12px;color:#aaa;margin:8px 0">فیلم‌های فعلی:</p>
      <div style="max-height:200px;overflow:auto;margin-bottom:12px">
        ${movies.map(m => `
          <div style="display:flex;align-items:center;gap:8px;padding:6px;background:rgba(255,255,255,.04);border-radius:8px;margin-bottom:4px">
            <img src="${esc(m.poster||fallback)}" style="width:30px;height:42px;object-fit:cover;border-radius:4px" onerror="posterError(this)">
            <span style="flex:1;font-size:12px">${esc(m.title)}</span>
            <button onclick="editMovie('${esc(m.id)}')" style="padding:4px 8px;font-size:11px;border-radius:6px;border:1px solid #a855f7;background:rgba(168,85,247,.2);color:#e0c0ff">ویرایش</button>
          </div>
        `).join("")}
      </div>
      <h4 id="formTitle">➕ افزودن جدید</h4>
      <input class="admin-input" id="aTitle" placeholder="نام فیلم/سریال">
      <select class="admin-input" id="aType"><option value="movie">فیلم</option><option value="series">سریال</option></select>
      <input class="admin-input" id="aGenre" placeholder="ژانر">
      <input class="admin-input" id="aYear" placeholder="سال">
      <input class="admin-input" id="aRating" placeholder="امتیاز">
      <input class="admin-input" id="aPoster" placeholder="لینک پوستر">
      <input class="admin-input" id="aVideo" placeholder="لینک ویدیو">
      <input class="admin-input" id="aEpisodes" placeholder="تعداد قسمت (سریال)">
      <textarea class="admin-input" id="aDesc" rows="2" placeholder="توضیحات"></textarea>
      <button class="btn play" style="width:100%;margin-top:6px" onclick="saveAdmin()">ذخیره</button>
      <button class="btn" style="width:100%;margin-top:6px" onclick="renderSettings()">بستن</button>
    </div>
  `;
  window.editingId = null;
}

function editMovie(id){
  const m = movies.find(x => String(x.id)===String(id));
  if(!m) return;
  window.editingId = id;
  document.getElementById("formTitle").textContent = "✏️ ویرایش: " + m.title;
  document.getElementById("aTitle").value = m.title||"";
  document.getElementById("aType").value = m.type||"movie";
  document.getElementById("aGenre").value = m.genre||"";
  document.getElementById("aYear").value = m.year||"";
  document.getElementById("aRating").value = m.rating||"";
  document.getElementById("aPoster").value = m.poster||"";
  document.getElementById("aVideo").value = m.videoLink||"";
  document.getElementById("aEpisodes").value = m.episodes||"";
  document.getElementById("aDesc").value = m.description||"";
  toast("در حال ویرایش");
}

function saveAdmin(){
  const title = document.getElementById("aTitle").value.trim();
  if(!title){ toast("نام را وارد کن"); return; }
  const data = {
    title,
    type: document.getElementById("aType").value,
    genre: document.getElementById("aGenre").value.trim()||"عمومی",
    year: document.getElementById("aYear").value.trim(),
    rating: document.getElementById("aRating").value.trim()||"0",
    poster: document.getElementById("aPoster").value.trim()||fallback,
    videoLink: document.getElementById("aVideo").value.trim(),
    description: document.getElementById("aDesc").value.trim(),
    isNew: true
  };
  if(data.type==="series") data.episodes = parseInt(document.getElementById("aEpisodes").value)||8;

  if(window.editingId){
    const i = movies.findIndex(m => String(m.id)===String(window.editingId));
    if(i>-1) movies[i] = {...movies[i], ...data};
    toast("ویرایش شد");
  } else {
    data.id = String(Date.now());
    movies.unshift(data);
    toast("اضافه شد");
  }
  saveMovies();
  renderHome();
  openAdmin();
}

/* INIT */
loadData();
renderHome();
</script>

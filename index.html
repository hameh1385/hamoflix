<script>
/* ================================
   HAMOFLIX — PLAYER + DETAIL PAGE
   ================================ */

const LEGAL_TEST_VIDEO =
  "https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4";

/* ---------- Featured Slider Fix ---------- */

let featuredIndex = 0;
let featuredTouchStartX = 0;
let featuredTouchEndX = 0;

function getFeaturedMovies() {
  const selected = movies.filter(m => m.featured);

  if (selected.length >= 5) return selected.slice(0, 5);

  const fallback = movies.filter(m => !selected.includes(m));

  return [...selected, ...fallback].slice(0, 5);
}

function renderFeatured() {
  const box = document.getElementById("featuredSlider");
  if (!box) return;

  const list = getFeaturedMovies();

  if (!list.length) {
    box.innerHTML = "";
    return;
  }

  if (featuredIndex >= list.length) featuredIndex = 0;
  if (featuredIndex < 0) featuredIndex = list.length - 1;

  box.innerHTML = list.map((movie, i) => `
    <article
      class="featured-card ${i === featuredIndex ? "featured-active" : ""}"
      onclick="openMoviePage(${movie.id})"
    >
      <img
        src="${movie.poster || fallbackPoster(movie.title)}"
        loading="lazy"
        onerror="this.src='${fallbackPoster(movie.title)}'"
      >

      <div class="featured-overlay">
        <strong>${escapeHTML(movie.title)}</strong>
        <small>${escapeHTML(movie.faTitle || "")}</small>
      </div>
    </article>
  `).join("");

  requestAnimationFrame(() => {
    const active = box.querySelector(".featured-active");

    if (active) {
      active.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "center"
      });
    }
  });
}

function featuredNext() {
  const list = getFeaturedMovies();
  if (!list.length) return;

  featuredIndex = (featuredIndex + 1) % list.length;
  renderFeatured();
}

function featuredPrev() {
  const list = getFeaturedMovies();
  if (!list.length) return;

  featuredIndex =
    (featuredIndex - 1 + list.length) % list.length;

  renderFeatured();
}

function setupFeaturedSwipe() {
  const box = document.getElementById("featuredSlider");
  if (!box) return;

  box.addEventListener("touchstart", e => {
    featuredTouchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  box.addEventListener("touchend", e => {
    featuredTouchEndX = e.changedTouches[0].screenX;

    const distance =
      featuredTouchEndX - featuredTouchStartX;

    if (Math.abs(distance) < 40) return;

    if (distance < 0) {
      featuredNext();
    } else {
      featuredPrev();
    }
  }, { passive: true });
}

/* ---------- Full Movie Page ---------- */

function openMoviePage(id, resume = false) {
  const movie = movies.find(m => Number(m.id) === Number(id));
  if (!movie) return;

  closeAllOverlays();

  const app = document.getElementById("app");
  if (!app) return;

  const similar = movies
    .filter(m =>
      Number(m.id) !== Number(movie.id) &&
      (
        m.genre === movie.genre ||
        m.type === movie.type
      )
    )
    .slice(0, 8);

  const saved =
    getContinueList().find(x => Number(x.id) === Number(movie.id));

  app.innerHTML = `
    <main class="single-movie-page">

      <button class="back-button" onclick="goHome()">
        ← بازگشت
      </button>

      <section class="single-movie-hero glass">

        <div class="single-poster-wrap">
          <img
            class="single-poster"
            src="${movie.poster || fallbackPoster(movie.title)}"
            onerror="this.src='${fallbackPoster(movie.title)}'"
          >
        </div>

        <div class="single-info">

          <span class="movie-type">
            ${movie.type === "series" ? "📺 سریال" : "🎬 فیلم"}
          </span>

          <h1>${escapeHTML(movie.title)}</h1>

          ${
            movie.faTitle
              ? `<div class="single-fa-title">${escapeHTML(movie.faTitle)}</div>`
              : ""
          }

          <div class="single-meta">
            ${movie.year || ""}
            ${movie.genre ? " • " + escapeHTML(movie.genre) : ""}
            ${movie.rating ? " • ⭐ " + movie.rating : ""}
          </div>

          <p class="single-description">
            ${escapeHTML(
              movie.description ||
              "توضیحی برای این عنوان ثبت نشده است."
            )}
          </p>

          <div class="single-actions">

            <button
              class="primary-action"
              onclick="playOnline(${movie.id})"
            >
              ▶️ پخش آنلاین
            </button>

            ${
              saved
                ? `
                  <button
                    class="secondary-action"
                    onclick="playContinue(${movie.id})"
                  >
                    ▶️ ادامه تماشا
                  </button>
                `
                : ""
            }

            <button
              class="secondary-action"
              onclick="openMXPlayer(${movie.id})"
            >
              MX Player
            </button>

            <button
              class="secondary-action"
              onclick="openChrome(${movie.id})"
            >
              Google Chrome
            </button>

            ${
              movie.downloadUrl
                ? `
                  <a
                    class="secondary-action"
                    href="${movie.downloadUrl}"
                    target="_blank"
                    rel="noopener"
                  >
                    ⬇️ دانلود
                  </a>
                `
                : ""
            }

          </div>

          <div class="movie-rating-box">
            <span>امتیاز شما:</span>

            <div class="rating-buttons">
              ${Array.from({length: 10}, (_, i) => `
                <button
                  onclick="rateMovie(${movie.id}, ${i + 1})"
                  class="${
                    Number(localStorage.getItem("rate_" + movie.id)) === i + 1
                      ? "rated"
                      : ""
                  }"
                >
                  ${i + 1}
                </button>
              `).join("")}
            </div>
          </div>

        </div>
      </section>

      <section class="movie-comments glass">
        <h2>💬 نظرات</h2>

        <form onsubmit="addComment(event, ${movie.id})">
          <input
            id="commentInput"
            placeholder="نظر خودت را بنویس..."
            maxlength="300"
          >

          <button type="submit">
            ارسال
          </button>
        </form>

        <div id="comments-${movie.id}">
          ${renderComments(movie.id)}
        </div>
      </section>

      ${
        similar.length
          ? `
            <section class="similar-section">
              <div class="section-title-row">
                <h2>🎯 فیلم‌های مشابه</h2>
              </div>

              <div class="similar-grid">
                ${similar.map(renderMovieCard).join("")}
              </div>
            </section>
          `
          : ""
      }

    </main>
  `;

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

  if (resume) {
    setTimeout(() => playContinue(movie.id), 250);
  }
}

/* ---------- Movie Card ---------- */

function renderMovieCard(movie) {
  return `
    <article
      class="movie-card"
      onclick="openMoviePage(${movie.id})"
    >

      <div class="poster-box">

        <img
          src="${movie.poster || fallbackPoster(movie.title)}"
          loading="lazy"
          alt="${escapeHTML(movie.title)}"
          onerror="this.src='${fallbackPoster(movie.title)}'"
        >

        ${
          movie.isNew
            ? `<span class="new-badge">جدید</span>`
            : ""
        }

      </div>

      <div class="movie-card-title">
        ${escapeHTML(movie.title)}
      </div>

      ${
        movie.faTitle
          ? `
            <div class="movie-card-fa-title">
              ${escapeHTML(movie.faTitle)}
            </div>
          `
          : ""
      }

      <div class="movie-card-meta">
        ${movie.year || ""}
        ${movie.rating ? " • ⭐ " + movie.rating : ""}
      </div>

    </article>
  `;
}

/* ---------- Continue Watching ---------- */

const CONTINUE_KEY = "hamoflix_continue_v1";
const HISTORY_KEY = "hamoflix_history_v1";

function getContinueList() {
  try {
    return JSON.parse(
      localStorage.getItem(CONTINUE_KEY) || "[]"
    );
  } catch {
    return [];
  }
}

function saveContinueList(list) {
  localStorage.setItem(
    CONTINUE_KEY,
    JSON.stringify(list.slice(0, 10))
  );
}

function saveProgress(id, position, duration) {
  if (!duration || !isFinite(duration)) return;

  let list = getContinueList();

  const item = {
    id: Number(id),
    position: Number(position),
    duration: Number(duration),
    updatedAt: Date.now()
  };

  list = list.filter(
    x => Number(x.id) !== Number(id)
  );

  if (position / duration < 0.95) {
    list.unshift(item);
  }

  saveContinueList(list);
}

function removeContinue(id) {
  const list = getContinueList().filter(
    x => Number(x.id) !== Number(id)
  );

  saveContinueList(list);
}

function playContinue(id) {
  const saved = getContinueList().find(
    x => Number(x.id) === Number(id)
  );

  playOnline(id, saved ? saved.position : 0);
}

/* ---------- History ---------- */

function addHistory(id) {
  let list = [];

  try {
    list = JSON.parse(
      localStorage.getItem(HISTORY_KEY) || "[]"
    );
  } catch {}

  list = list.filter(
    x => Number(x.id) !== Number(id)
  );

  list.unshift({
    id: Number(id),
    watchedAt: Date.now()
  });

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(list.slice(0, 30))
  );
}

/* ---------- Player ---------- */

let currentPlayingId = null;
let playerSaveTimer = null;

function createPlayer() {
  if (document.getElementById("hamoPlayer")) return;

  document.body.insertAdjacentHTML("beforeend", `
    <div id="hamoPlayer" class="hamo-player">

      <div class="player-top">
        <button onclick="closePlayer()">✕</button>
        <div id="playerTitle"></div>
      </div>

      <div class="player-video-area">

        <video
          id="hamoVideo"
          playsinline
          preload="metadata"
        ></video>

        <div id="playerError" class="player-error">
          <div>⚠️ پخش این فایل در مرورگر انجام نشد.</div>
          <small>
            ممکن است فرمت MKV یا سرور فایل اجازه پخش مستقیم در مرورگر را ندهد.
          </small>

          <button id="fallbackOpen">
            باز کردن لینک
          </button>
        </div>

        <div class="player-center-controls">

          <button onclick="seekVideo(-10)">
            ↶ 10
          </button>

          <button
            id="centerPlay"
            onclick="toggleVideo()"
          >
            ▶
          </button>

          <button onclick="seekVideo(10)">
            10 ↷
          </button>

        </div>

      </div>

      <div class="player-controls">

        <input
          id="videoProgress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <div class="player-time">
          <span id="currentTime">00:00</span>
          <span id="durationTime">00:00</span>
        </div>

        <div class="player-buttons">

          <button onclick="toggleVideo()">▶/Ⅱ</button>

          <button onclick="toggleMute()">🔊</button>

          <input
            id="volumeRange"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="1"
          >

          <button onclick="changeSpeed()">1x</button>

          <button onclick="toggleFit()">⛶</button>

          <button onclick="toggleFullscreen()">⛶</button>

        </div>

      </div>

    </div>
  `);

  const video = document.getElementById("hamoVideo");

  video.addEventListener("timeupdate", updatePlayerUI);

  video.addEventListener("loadedmetadata", () => {
    const saved = getContinueList().find(
      x => Number(x.id) === Number(currentPlayingId)
    );

    if (
      saved &&
      saved.position > 0 &&
      saved.position < video.duration * 0.95
    ) {
      video.currentTime = saved.position;
    }

    updatePlayerUI();
  });

  video.addEventListener("play", () => {
    document.getElementById("centerPlay").textContent = "Ⅱ";
  });

  video.addEventListener("pause", () => {
    document.getElementById("centerPlay").textContent = "▶";
    saveCurrentProgress();
  });

  video.addEventListener("ended", () => {
    if (currentPlayingId !== null) {
      removeContinue(currentPlayingId);
    }
  });

  video.addEventListener("error", () => {
    const error = document.getElementById("playerError");

    if (error) {
      error.classList.add("show");
    }
  });

  document
    .getElementById("videoProgress")
    .addEventListener("input", e => {
      if (!video.duration) return;

      video.currentTime =
        (Number(e.target.value) / 100) *
        video.duration;
    });

  document
    .getElementById("volumeRange")
    .addEventListener("input", e => {
      video.volume = Number(e.target.value);
      video.muted = false;
    });
}

function playOnline(id, startPosition = null) {
  const movie = movies.find(
    m => Number(m.id) === Number(id)
  );

  if (!movie) return;

  createPlayer();

  currentPlayingId = Number(id);

  addHistory(id);

  const video = document.getElementById("hamoVideo");
  const player = document.getElementById("hamoPlayer");
  const title = document.getElementById("playerTitle");
  const error = document.getElementById("playerError");

  title.textContent =
    movie.faTitle
      ? `${movie.title} — ${movie.faTitle}`
      : movie.title;

  error.classList.remove("show");

  /*
    فقط URL مستقیم و مجاز را اینجا استفاده کن.
    برای تست Interstellar فعلاً لینک واقعی آن را قرار نمی‌دهیم.
    اگر لینک مستقیم مجاز خودت را در watchUrl قرار دهی،
    همین پلیر آن را باز می‌کند.
  */
  let source = movie.watchUrl;

  if (!source) {
    source = LEGAL_TEST_VIDEO;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  video.src = source;

  player.classList.add("show");
  document.body.classList.add("player-open");

  video.load();

  video.addEventListener("loadedmetadata", function firstLoad() {

    video.removeEventListener(
      "loadedmetadata",
      firstLoad
    );

    if (
      startPosition !== null &&
      isFinite(startPosition) &&
      startPosition < video.duration
    ) {
      video.currentTime = startPosition;
    }

    video.play().catch(() => {});
  });

  document.getElementById("fallbackOpen").onclick = () => {
    window.open(source, "_blank", "noopener");
  };

  playerSaveTimer = setInterval(
    saveCurrentProgress,
    2000
  );
}

function saveCurrentProgress() {
  if (currentPlayingId === null) return;

  const video = document.getElementById("hamoVideo");

  if (!video || !video.duration) return;

  saveProgress(
    currentPlayingId,
    video.currentTime,
    video.duration
  );
}

function closePlayer() {
  saveCurrentProgress();

  if (playerSaveTimer) {
    clearInterval(playerSaveTimer);
    playerSaveTimer = null;
  }

  const video = document.getElementById("hamoVideo");

  if (video) {
    video.pause();
    video.removeAttribute("src");
    video.load();
  }

  const player = document.getElementById("hamoPlayer");

  if (player) {
    player.classList.remove("show");
  }

  document.body.classList.remove("player-open");

  currentPlayingId = null;
}

function toggleVideo() {
  const video = document.getElementById("hamoVideo");
  if (!video) return;

  if (video.paused) {
    video.play().catch(() => {});
  } else {
    video.pause();
  }
}

function seekVideo(seconds) {
  const video = document.getElementById("hamoVideo");
  if (!video) return;

  video.currentTime = Math.max(
    0,
    Math.min(
      video.duration || Infinity,
      video.currentTime + seconds
    )
  );
}

function toggleMute() {
  const video = document.getElementById("hamoVideo");
  if (!video) return;

  video.muted = !video.muted;
}

let playerSpeed = 1;

function changeSpeed() {
  const video = document.getElementById("hamoVideo");
  if (!video) return;

  const speeds = [
    0.5,
    0.75,
    1,
    1.25,
    1.5,
    1.75,
    2
  ];

  let index = speeds.indexOf(playerSpeed);

  index = (index + 1) % speeds.length;

  playerSpeed = speeds[index];

  video.playbackRate = playerSpeed;
}

let playerFit = false;

function toggleFit() {
  const video = document.getElementById("hamoVideo");
  if (!video) return;

  playerFit = !playerFit;

  video.style.objectFit =
    playerFit ? "cover" : "contain";
}

async function toggleFullscreen() {
  const player = document.getElementById("hamoPlayer");

  if (!document.fullscreenElement) {
    await player?.requestFullscreen?.();
  } else {
    await document.exitFullscreen?.();
  }
}

function updatePlayerUI() {
  const video = document.getElementById("hamoVideo");

  if (!video) return;

  const progress =
    document.getElementById("videoProgress");

  if (progress && video.duration) {
    progress.value =
      (video.currentTime / video.duration) * 100;
  }

  const current =
    document.getElementById("currentTime");

  const duration =
    document.getElementById("durationTime");

  if (current) {
    current.textContent =
      formatTime(video.currentTime);
  }

  if (duration) {
    duration.textContent =
      formatTime(video.duration);
  }

  if (
    video.duration &&
    video.currentTime / video.duration >= 0.95
  ) {
    removeContinue(currentPlayingId);
  }
}

function formatTime(seconds) {
  if (!isFinite(seconds)) return "00:00";

  seconds = Math.max(0, Math.floor(seconds));

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  if (h) {
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

/* ---------- Android Players ---------- */

function openChrome(id) {
  const movie = movies.find(
    m => Number(m.id) === Number(id)
  );

  if (!movie?.watchUrl) {
    playOnline(id);
    return;
  }

  addHistory(id);

  const url = movie.watchUrl;

  window.location.href =
    "googlechrome://navigate?url=" +
    encodeURIComponent(url);
}

function openMXPlayer(id) {
  const movie = movies.find(
    m => Number(m.id) === Number(id)
  );

  if (!movie?.watchUrl) {
    playOnline(id);
    return;
  }

  addHistory(id);

  const url = movie.watchUrl;

  window.location.href =
    "intent://" +
    url.replace(/^https?:\/\//, "") +
    "#Intent;scheme=http;package=com.mxtech.videoplayer.ad;end";
}

/* ---------- Comments ---------- */

function getComments(id) {
  try {
    return JSON.parse(
      localStorage.getItem("comments_" + id) || "[]"
    );
  } catch {
    return [];
  }
}

function renderComments(id) {
  const comments = getComments(id);

  if (!comments.length) {
    return `
      <div class="empty-comments">
        هنوز نظری ثبت نشده.
      </div>
    `;
  }

  return comments
    .map(c => `
      <div class="comment-item">
        <div>${escapeHTML(c.text)}</div>
        <small>
          ${new Date(c.time).toLocaleDateString("fa-IR")}
        </small>
      </div>
    `)
    .join("");
}

function addComment(event, id) {
  event.preventDefault();

  const input =
    document.getElementById("commentInput");

  if (!input || !input.value.trim()) return;

  const comments = getComments(id);

  comments.unshift({
    text: input.value.trim(),
    time: Date.now()
  });

  localStorage.setItem(
    "comments_" + id,
    JSON.stringify(comments.slice(0, 50))
  );

  openMoviePage(id);
}

function rateMovie(id, rating) {
  localStorage.setItem(
    "rate_" + id,
    String(rating)
  );

  openMoviePage(id);
}

/* ---------- Navigation ---------- */

function goHome() {
  if (typeof renderHome === "function") {
    renderHome();
  } else {
    location.reload();
  }

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });
}

function closeAllOverlays() {
  document
    .querySelectorAll(".modal.show")
    .forEach(x => x.classList.remove("show"));
}

/* ---------- Helpers ---------- */

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function fallbackPoster(title) {
  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="600"
           height="900"
           viewBox="0 0 600 900">
        <defs>
          <linearGradient id="g"
            x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#24103f"/>
            <stop offset="100%" stop-color="#08030f"/>
          </linearGradient>
        </defs>
        <rect width="600" height="900" fill="url(#g)"/>
        <text x="300"
              y="450"
              fill="white"
              font-size="34"
              text-anchor="middle"
              font-family="Arial">
          ${String(title || "HAMOFLIX")
            .replace(/[<>&"]/g, "")}
        </text>
      </svg>
    `);
}

  margin: 8px 0 0;
  font-size: clamp(28px, 5vw, 48px);
}

.single-meta {
  color: rgba(255,255,255,.55);
  margin: 14px 0;
}

.single-description {
  color: rgba(255,255,255,.76);
  line-height: 2;
  max-width: 720px;
}

.single-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 20px 0;
}

.single-actions button,
.single-actions a {
  text-decoration: none;
  color: white;
  border: 0;
  border-radius: 13px;
  padding: 11px 15px;
  cursor: pointer;
}

.primary-action {
  background: linear-gradient(
    135deg,
    #9d5cff,
    #6735d5
  );
}

.secondary-action {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12) !important;
}

.movie-rating-box {
  margin-top: 18px;
}

.rating-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 9px;
}

.rating-buttons button {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: white;
}

.rating-buttons button.rated {
  background: #8c4cff;
}

.movie-comments {
  margin-top: 20px;
  padding: 20px;
  border-radius: 22px;
}

.movie-comments form {
  display: flex;
  gap: 8px;
  margin: 12px 0 18px;
}

.movie-comments input {
  flex: 1;
  min-width: 0;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(255,255,255,.06);
  color: white;
  border-radius: 12px;
  padding: 12px;
}

.movie-comments button {
  border: 0;
  border-radius: 12px;
  padding: 0 18px;
  color: white;
  background: #7942e8;
}

.comment-item {
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.comment-item small {
  color: rgba(255,255,255,.4);
}

.similar-section {
  margin-top: 28px;
}

.similar-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(145px, 1fr));
  gap: 14px;
}

.similar-grid .movie-card {
  min-width: 0;
}

.similar-grid .poster-box {
  aspect-ratio: 2 / 3;
}

/* Featured */

.featured-card {
  flex: 0 0 190px;
  aspect-ratio: 2 / 3;
  scroll-snap-align: center;
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,.08);
  transition:
    transform .25s ease,
    opacity .25s ease;
}

.featured-card img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.featured-card:not(.featured-active) {
  opacity: .72;
  transform: scale(.94);
}

.featured-active {
  transform: scale(1);
  opacity: 1;
}

.featured-overlay {
  position: absolute;
  inset: auto 0 0;
  padding: 35px 12px 12px;
  background: linear-gradient(
    transparent,
    rgba(5,1,15,.94)
  );
}

.featured-overlay strong {
  display: block;
  font-size: 15px;
}

.featured-overlay small {
  display: block;
  color: rgba(255,255,255,.48);
  font-size: 11px;
  margin-top: 3px;
}

/* Player */

.hamo-player {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: none;
  flex-direction: column;
  background: #05020a;
}

.hamo-player.show {
  display: flex;
}

body.player-open {
  overflow: hidden;
}

.player-top {
  min-height: 58px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 8px 14px;
  background: rgba(15,7,25,.88);
  backdrop-filter: blur(20px);
}

.player-top button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 13px;
  color: white;
  background: rgba(255,255,255,.08);
  font-size: 18px;
}

#playerTitle {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.player-video-area {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#hamoVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.player-center-controls {
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: 18px;
  opacity: .92;
}

.player-center-controls button {
  border: 0;
  color: white;
  background: rgba(30,10,50,.78);
  backdrop-filter: blur(14px);
  border-radius: 50px;
  min-width: 54px;
  height: 54px;
}

.player-center-controls button:nth-child(2) {
  width: 68px;
  height: 68px;
  font-size: 23px;
}

.player-controls {
  padding: 10px 14px 14px;
  background: rgba(15,7,25,.9);
  backdrop-filter: blur(20px);
}

#videoProgress {
  width: 100%;
}

.player-time {
  display: flex;
  justify-content: space-between;
  color: rgba(255,255,255,.58);
  font-size: 12px;
}

.player-buttons {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
}

.player-buttons button {
  border: 0;
  border-radius: 11px;
  min-width: 42px;
  height: 38px;
  color: white;
  background: rgba(255,255,255,.08);
}

#volumeRange {
  width: 90px;
}

.player-error {
  display: none;
  position: absolute;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  width: min(420px, 88%);
  text-align: center;
  padding: 25px;
  border-radius: 22px;
  background: rgba(25,10,40,.94);
  border: 1px solid rgba(255,255,255,.12);
}

.player-error.show {
  display: block;
}

.player-error small {
  display: block;
  color: rgba(255,255,255,.55);
  margin: 10px 0 16px;
  line-height: 1.8;
}

.player-error button {
  border: 0;
  border-radius: 12px;
  padding: 11px 18px;
  color: white;
  background: #7c43e8;
}

@media (max-width: 650px) {

  .single-movie-hero {
    grid-template-columns: 1fr;
    padding: 16px;
  }

  .single-poster-wrap {
    width: min(220px, 70%);
  }

  .single-info h1 {
    font-size: 27px;
  }

  .similar-grid {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

  .featured-card {
    flex-basis: 150px;
  }

  .player-buttons {
    overflow-x: auto;
  }

}

`;

document.head.appendChild(hamoExtraStyle);

/* ---------- Keyboard Controls ---------- */

document.addEventListener("keydown", e => {

  const player =
    document.getElementById("hamoPlayer");

  if (!player?.classList.contains("show")) return;

  if (e.code === "Space") {
    e.preventDefault();
    toggleVideo();
  }

  if (e.key === "ArrowLeft") {
    seekVideo(-10);
  }

  if (e.key === "ArrowRight") {
    seekVideo(10);
  }

  if (e.key.toLowerCase() === "m") {
    toggleMute();
  }

  if (e.key.toLowerCase() === "f") {
    toggleFullscreen();
  }

  if (e.key === "Escape") {
    closePlayer();
  }
});

/* ---------- Save Before Leaving ---------- */

window.addEventListener(
  "beforeunload",
  saveCurrentProgress
);

/* ---------- Start ---------- */

document.addEventListener("DOMContentLoaded", () => {
  createPlayer();
  renderFeatured();
  setupFeaturedSwipe();
});
</script>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090613">
<meta name="description" content="HAMOFLIX - فیلم و سریال">
<title>HAMOFLIX</title>

<style>
:root{
  --bg:#090613;
  --glass:rgba(255,255,255,.075);
  --glass2:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.13);
  --purple:#9b5cff;
  --purple2:#6c35d9;
  --text:#fff;
  --muted:#aaa5b8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 0%,rgba(137,65,255,.18),transparent 35%),
    radial-gradient(circle at 100% 35%,rgba(91,37,165,.12),transparent 30%),
    linear-gradient(180deg,#090613,#0d0717 60%,#08050d);
  font-family:Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.hidden{display:none!important}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  padding:10px 14px;
  background:rgba(9,6,19,.84);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  min-width:105px;
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
  user-select:none;
  text-shadow:0 0 18px rgba(155,92,255,.7);
}

.logo span{color:#a967ff}

.search-box{
  position:relative;
  flex:1;
}

.search{
  width:100%;
  height:43px;
  padding:0 18px;
  color:white;
  outline:none;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(255,255,255,.065);
}

.search::placeholder{color:#9f99ab}
.search:focus{border-color:rgba(155,92,255,.55)}

.search-results{
  position:absolute;
  top:50px;
  left:0;
  right:0;
  max-height:330px;
  overflow:auto;
  padding:7px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(18,10,32,.97);
  box-shadow:0 15px 40px rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
}

.search-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:11px;
}

.search-item:hover{background:rgba(155,92,255,.12)}

.search-item img{
  width:40px;
  height:55px;
  object-fit:cover;
  border-radius:7px;
}

.search-item-title{
  font-size:13px;
  font-weight:bold;
}

.search-item-info{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* ================= HERO / FEATURED ================= */

.hero{
  max-width:1250px;
  margin:15px auto 0;
  padding:0 14px;
}

.hero-card{
  position:relative;
  overflow:hidden;
  padding:18px;
  border:1px solid var(--border);
  border-radius:24px;
  background:
    radial-gradient(circle at 85% 15%,rgba(155,92,255,.25),transparent 38%),
    linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.07);
}

.welcome{
  position:relative;
  z-index:2;
  padding:2px 5px 15px;
}

.welcome-title{
  margin:0;
  font-size:clamp(22px,4vw,31px);
  font-weight:900;
}

.welcome-title span{color:#a967ff}

.welcome-text{
  margin:7px 0 0;
  color:#aaa4b5;
  font-size:12px;
  line-height:1.8;
}

/* featured slider */

.featured-wrap{
  position:relative;
  overflow:hidden;
  border-radius:17px;
}

.featured{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:3px 2px 9px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}

.featured::-webkit-scrollbar{display:none}

.featured-card{
  position:relative;
  flex:0 0 calc((100% - 40px)/5);
  min-width:0;
  overflow:hidden;
  aspect-ratio:3/2;
  border:1px solid rgba(255,255,255,.13);
  border-radius:14px;
  background:#171020;
  box-shadow:
    0 8px 24px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.06);
  transform:translateZ(0);
  contain:paint;
}

.featured-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.featured-overlay{
  position:absolute;
  inset:auto 0 0;
  padding:22px 8px 8px;
  background:linear-gradient(transparent,rgba(0,0,0,.88));
}

.featured-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:11px;
  font-weight:900;
}

.featured-rating{
  margin-top:3px;
  color:#dfb6ff;
  font-size:9px;
}

.featured-arrow{
  position:absolute;
  top:50%;
  z-index:5;
  width:31px;
  height:31px;
  transform:translateY(-50%);
  border:1px solid rgba(255,255,255,.14);
  border-radius:50%;
  color:white;
  background:rgba(10,5,20,.72);
  backdrop-filter:blur(6px);
}

.featured-arrow.left{left:7px}
.featured-arrow.right{right:7px}

.featured-dots{
  display:flex;
  justify-content:center;
  gap:5px;
  padding-top:3px;
}

.featured-dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#55505e;
  transition:.2s;
}

.featured-dot.active{
  width:15px;
  border-radius:8px;
  background:var(--purple);
}

/* ================= GENRES ================= */

.genres{
  max-width:1250px;
  margin:15px auto 0;
  padding:0 14px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.genres::-webkit-scrollbar{display:none}

.genre{
  flex:none;
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:30px;
  color:#ddd6e8;
  background:var(--glass);
  white-space:nowrap;
}

.genre.active{
  color:#fff;
  background:rgba(155,92,255,.28);
  border-color:rgba(155,92,255,.5);
}

/* ================= MAIN ================= */

main{
  max-width:1250px;
  margin:auto;
  padding-bottom:125px;
}

.section{margin-top:27px}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px 11px;
}

.section-title{
  margin:0;
  font-size:19px;
  font-weight:900;
}

.section-title::before{
  content:"";
  display:inline-block;
  width:4px;
  height:19px;
  margin-left:8px;
  vertical-align:-3px;
  border-radius:10px;
  background:var(--purple);
  box-shadow:0 0 12px var(--purple);
}

.view-all{
  border:0;
  color:#b989ff;
  background:none;
  font-size:12px;
}

/* ================= CARDS ================= */

.carousel{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;
  padding:3px 14px 13px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.carousel::-webkit-scrollbar{display:none}

.movie-card{
  position:relative;
  flex:0 0 calc((100% - 48px)/5);
  min-width:0;
  padding:7px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--glass);
  box-shadow:
    0 8px 22px rgba(0,0,0,.2),
    inset 0 1px rgba(255,255,255,.055);
  scroll-snap-align:start;
  transform:translateZ(0);
  contain:layout paint;
}

.poster-wrap{
  position:relative;
  overflow:hidden;
  aspect-ratio:3/2;
  border-radius:10px;
  background:#171020;
}

.poster{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#171020;
}

.movie-info{
  padding:8px 2px 2px;
}

.movie-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
  font-weight:800;
}

.movie-meta{
  display:flex;
  gap:5px;
  margin-top:5px;
  color:#a9a3b2;
  font-size:9px;
}

.movie-rating{color:#e0b1ff}

.new-badge{
  position:absolute;
  top:11px;
  right:11px;
  z-index:3;
  padding:4px 7px;
  border-radius:7px;
  color:white;
  background:rgba(155,92,255,.88);
  font-size:9px;
  font-weight:bold;
}

.favorite-btn{
  position:absolute;
  top:10px;
  left:10px;
  z-index:4;
  width:28px;
  height:28px;
  padding:0;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  color:white;
  background:rgba(0,0,0,.48);
}

.favorite-btn.active{color:#ff73a2}

.see-all-card{
  flex:0 0 calc((100% - 48px)/5);
  min-height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(155,92,255,.3);
  border-radius:15px;
  background:
    radial-gradient(circle,rgba(155,92,255,.18),transparent 65%),
    rgba(255,255,255,.055);
}

.see-all-inner{text-align:center}

.see-all-icon{
  width:42px;
  height:42px;
  margin:0 auto 9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(155,92,255,.16);
  font-size:21px;
}

.see-all-text{
  font-size:12px;
  font-weight:bold;
}

/* ================= FULL PAGES ================= */

.page{
  min-height:calc(100vh - 75px);
  padding:20px 14px 130px;
}

.page-inner{
  max-width:1250px;
  margin:auto;
}

.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.page-title{
  margin:0;
  font-size:25px;
  font-weight:900;
}

.page-subtitle{
  margin:7px 0 0;
  color:#9992a5;
  font-size:12px;
}

.back-btn{
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  background:var(--glass);
}

.full-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:15px;
}

.full-grid .movie-card{
  width:100%;
  flex:none;
}

.full-grid .poster-wrap{
  aspect-ratio:3/2;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:11px;
  z-index:150;
  width:min(430px,calc(100% - 26px));
  transform:translateX(-50%);
  display:flex;
  justify-content:space-around;
  padding:7px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  background:rgba(20,11,33,.86);
  box-shadow:
    0 15px 45px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(13px);
}

.nav-btn{
  flex:1;
  min-width:65px;
  padding:7px 5px;
  border:0;
  border-radius:15px;
  color:#9d97a8;
  background:transparent;
  font-size:10px;
}

.nav-btn span{
  display:block;
  margin-bottom:3px;
  font-size:18px;
}

.nav-btn.active{
  color:white;
  background:rgba(155,92,255,.2);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(5px);
}

.modal-box{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border:1px solid var(--border);
  border-radius:23px;
  background:#120a20;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.close{
  float:left;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:white;
  background:rgba(255,255,255,.08);
}

.modal-title{
  margin:0 0 16px;
  font-size:20px;
}

/* ================= DETAIL ================= */

.detail{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:20px;
}

.detail-poster{
  width:100%;
  aspect-ratio:3/2;
  object-fit:cover;
  border-radius:15px;
}

.detail-description{
  color:#b8b1c2;
  line-height:2;
  font-size:13px;
}

.detail-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}

.tag{
  padding:6px 9px;
  border-radius:9px;
  color:#c9a2ff;
  background:rgba(155,92,255,.12);
}

/* ================= BUTTONS ================= */

.primary{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:13px;
  color:white;
  background:linear-gradient(135deg,#9b5cff,#6530c9);
}

.secondary{
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:11px;
  color:white;
  background:var(--glass);
}

/* ================= SETTINGS ================= */

.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.setting-info strong{
  display:block;
  font-size:14px;
}

.setting-info small{
  display:block;
  margin-top:4px;
  color:#918a9b;
  font-size:11px;
}

.switch{
  position:relative;
  width:45px;
  height:25px;
  flex:none;
  border:0;
  border-radius:20px;
  background:#312a3b;
}

.switch::after{
  content:"";
  position:absolute;
  top:3px;
  right:22px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#aaa;
  transition:.2s;
}

.switch.on{background:#7c42db}
.switch.on::after{
  right:3px;
  background:white;
}

/* ================= FORMS ================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  color:white;
  background:rgba(255,255,255,.06);
}

textarea.field{
  min-height:100px;
  resize:vertical;
}

.form-full{grid-column:1/-1}

/* ================= ADMIN ================= */

.admin-list{margin-top:15px}

.admin-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,.04);
}

.admin-item img{
  width:45px;
  height:45px;
  object-fit:cover;
  border-radius:7px;
}

.admin-item-main{flex:1}

.delete{
  padding:7px 10px;
  border:0;
  border-radius:8px;
  color:white;
  background:rgba(255,60,90,.16);
}

.feature-select{
  margin:16px 0;
  padding:15px;
  border:1px solid rgba(155,92,255,.25);
  border-radius:15px;
  background:rgba(155,92,255,.07);
}

.feature-select h3{
  margin:0 0 6px;
  font-size:15px;
}

.feature-select p{
  margin:0 0 12px;
  color:#96909f;
  font-size:10px;
  line-height:1.8;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  max-height:260px;
  overflow:auto;
}

.feature-option{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:9px;
  background:rgba(255,255,255,.035);
}

.feature-option input{
  accent-color:#9b5cff;
}

.feature-option img{
  width:32px;
  height:25px;
  object-fit:cover;
  border-radius:5px;
}

.feature-option span{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:10px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  z-index:500;
  max-width:90%;
  padding:11px 16px;
  transform:translateX(-50%) translateY(15px);
  border:1px solid var(--border);
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  color:white;
  background:rgba(24,14,39,.95);
  box-shadow:0 12px 35px rgba(0,0,0,.4);
  transition:opacity .2s,transform .2s;
  font-size:12px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .movie-card,
  .see-all-card{
    flex-basis:calc((100% - 24px)/3);
  }

  .full-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .featured-card{
    flex-basis:calc((100% - 30px)/4);
  }
}

@media(max-width:600px){

  body{
    background:
      radial-gradient(circle at 30% 0%,rgba(137,65,255,.15),transparent 35%),
      #090613;
  }

  .header{padding:9px 10px}

  .header-inner{gap:8px}

  .logo{
    min-width:82px;
    font-size:17px;
  }

  .search{
    height:39px;
    border-radius:13px;
    font-size:12px;
  }

  .hero{
    margin-top:10px;
    padding:0 10px;
  }

  .hero-card{
    padding:14px;
    border-radius:19px;
  }

  .welcome{
    padding:2px 3px 11px;
  }

  .welcome-title{font-size:21px}

  .welcome-text{
    font-size:10px;
    margin-top:5px;
  }

  .featured{
    gap:8px;
  }

  .featured-card{
    flex-basis:calc((100% - 8px)/2);
    border-radius:11px;
  }

  .featured-title{font-size:10px}

  .featured-arrow{
    width:28px;
    height:28px;
  }

  .genres{
    padding:0 10px;
  }

  .section{
    margin-top:22px;
  }

  .section-head{
    padding:0 10px 9px;
  }

  .section-title{font-size:16px}

  .carousel{
    gap:8px;
    padding-left:10px;
    padding-right:10px;
  }

  .movie-card,
  .see-all-card{
    flex-basis:calc((100vw - 28px)/2.5);
  }

  .movie-card{
    padding:6px;
    border-radius:13px;
  }

  .poster-wrap{
    aspect-ratio:3/2;
    border-radius:9px;
  }

  .movie-title{font-size:10px}
  .movie-meta{font-size:8px}

  .page{
    padding:16px 10px 125px;
  }

  .page-title{font-size:22px}

  .full-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .full-grid .movie-card{
    padding:6px;
  }

  .full-grid .movie-title{font-size:11px}
  .full-grid .movie-meta{font-size:8px}

  .bottom-nav{
    bottom:8px;
    width:calc(100% - 22px);
    border-radius:19px;
  }

  .nav-btn{
    min-width:55px;
    padding:6px;
  }

  .nav-btn span{font-size:16px}

  .form-grid{grid-template-columns:1fr}
  .form-full{grid-column:auto}

  .detail{
    grid-template-columns:120px 1fr;
    gap:12px;
  }

  .detail h2{font-size:18px}
  .detail-description{font-size:11px}

  .feature-grid{
    grid-template-columns:1fr;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo" id="logo">
      HAMO<span>FLIX</span>
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        class="search"
        type="search"
        autocomplete="off"
        placeholder="جستجوی فیلم یا سریال..."
      >

      <div id="searchResults" class="search-results hidden"></div>

    </div>

  </div>
</header>

<!-- ================= HERO ================= -->

<section class="hero">

  <div class="hero-card">

    <div class="welcome">

function loadJSON(key,fallback){
try{
const x=localStorage.getItem(key);
return x?JSON.parse(x):fallback;
}catch(e){
return fallback;
}
}

function saveJSON(key,value){
try{
localStorage.setItem(key,JSON.stringify(value));
}catch(e){}
}

if(!Array.isArray(movies)||!movies.length){
movies=[...defaultMovies];
saveJSON(STORAGE_KEY,movies);
}

/* ================= HELPERS ================= */

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function posterURL(url){
return url||FALLBACK_POSTER;
}

function toast(message){

const el=document.getElementById("toast");

el.textContent=message;
el.classList.add("show");

clearTimeout(toast.timer);

toast.timer=setTimeout(()=>{
el.classList.remove("show");
},2200);

}

/* ================= FEATURED ================= */

function getFeatured(){

let list=featuredIds
.map(id=>movies.find(m=>String(m.id)===String(id)))
.filter(Boolean);

if(list.length<5){

const remaining=
movies
.filter(m=>!list.some(x=>x.id===m.id))
.sort((a,b)=>Number(b.rating||0)-Number(a.rating||0));

list=[
...list,
...remaining
].slice(0,5);

}

if(!list.length){

list=
[...movies]
.sort((a,b)=>Number(b.rating||0)-Number(a.rating||0))
.slice(0,5);

}

return list.slice(0,5);

}

function renderFeatured(){

const list=getFeatured();

if(!list.length)return;

if(featuredIndex>=list.length)
featuredIndex=0;

const box=document.getElementById("featured");

box.innerHTML=list.map((m,i)=>`

<article
class="featured-card"
onclick="openMovie('${m.id}')">

<img
src="${escapeHTML(posterURL(m.poster))}"
loading="${i===0?"eager":"lazy"}"
decoding="async"
onerror="this.onerror=null;this.src=FALLBACK_POSTER"
alt="${escapeHTML(m.title)}">

<div class="featured-overlay">

<div class="featured-title">
${escapeHTML(m.title)}
</div>

<div class="featured-rating">
⭐ ${escapeHTML(m.rating||"—")}
</div>

</div>

</article>

`).join("");

const dots=document.getElementById("featuredDots");

dots.innerHTML=list.map((m,i)=>`
<div class="featured-dot ${i===featuredIndex?"active":""}"></div>
`).join("");

}

function moveFeatured(direction){

const list=getFeatured();

if(list.length<=1)return;

featuredIndex=
(featuredIndex+direction+list.length)%list.length;

renderFeatured();

const box=document.getElementById("featured");

const cards=box.querySelectorAll(".featured-card");

if(cards[featuredIndex]){
cards[featuredIndex].scrollIntoView({
behavior:"smooth",
block:"nearest",
inline:"center"
});
}

resetFeaturedTimer();

}

function resetFeaturedTimer(){

clearInterval(featuredTimer);

featuredTimer=setInterval(()=>{
moveFeatured(1);
},5000);

}

document.getElementById("featuredPrev").onclick=()=>{
moveFeatured(-1);
};

document.getElementById("featuredNext").onclick=()=>{
moveFeatured(1);
};

/* swipe */

let featuredTouchX=0;

document.getElementById("featured")
.addEventListener("touchstart",e=>{
featuredTouchX=e.touches[0].clientX;
},{passive:true});

document.getElementById("featured")
.addEventListener("touchend",e=>{

const end=e.changedTouches[0].clientX;
const diff=end-featuredTouchX;

if(Math.abs(diff)>35){
moveFeatured(diff>0?-1:1);
}

},{passive:true});

/* ================= FAVORITES ================= */

function toggleFavorite(id,event){

if(event)event.stopPropagation();

const index=favorites.indexOf(id);

if(index>=0){

favorites.splice(index,1);
toast("از علاقه‌مندی‌ها حذف شد");

}else{

favorites.push(id);
toast("به علاقه‌مندی‌ها اضافه شد");

}

saveJSON(FAVORITES_KEY,favorites);

const active=document.querySelector(".nav-btn.active");

if(active&&active.dataset.nav==="movies")
openMoviesPage();

else if(active&&active.dataset.nav==="series")
openSeriesPage();

else
renderHome();

}

list.sort(

/* ================= NAV ================= */

function setActiveNav(nav){

document.querySelectorAll(".nav-btn")
.forEach(btn=>{

btn.classList.toggle(
"active",
btn.dataset.nav===nav
);

});

}

document.querySelectorAll(".nav-btn")
.forEach(btn=>{

btn.onclick=()=>{

const nav=btn.dataset.nav;

if(nav==="home")goHome();
else if(nav==="movies")openMoviesPage();
else if(nav==="series")openSeriesPage();
else if(nav==="settings")openSettingsPage();

};

});

function runAdvancedSearchPage(){

const title=
document.getElementById("advTitle")
.value.trim().toLowerCase();

const type=
document.getElementById("advType").value;

const genre=
document.getElementById("advGenre")
.value.trim().toLowerCase();

const year=
document.getElementById("advYear")
.value.trim();

const rating=
Number(document.getElementById("advRating").value)||0;

const result=movies.filter(m=>{

if(title&&!m.title.toLowerCase().includes(title))
return false;

if(type&&m.type!==type)
return false;

if(genre&&!(m.genre||"").toLowerCase().includes(genre))
return false;

if(year&&m.year!==year)
return false;

if(rating&&Number(m.rating||0)<rating)
return false;

return true;

});

document.getElementById("advancedResults").innerHTML=`

<h3>${result.length} نتیجه</h3>

<div class="full-grid">
${result.map(movieCard).join("")}
</div>

`;

}

function addMovie(){

const title=
document.getElementById("aTitle").value.trim();

if(!title){

toast("نام را وارد کن");
return;

}

const movie={

id:
"m_"+Date.now()+"_"+
Math.random().toString(36).slice(2,7),

title,

type:document.getElementById("aType").value,

genre:document.getElementById("aGenre").value.trim(),

year:document.getElementById("aYear").value.trim(),

rating:document.getElementById("aRating").value.trim(),

poster:document.getElementById("aPoster").value.trim(),

watch:document.getElementById("aWatch").value.trim(),

description:document.getElementById("aDescription").value.trim(),

section:document.getElementById("aSection").value,

isNew:document.getElementById("aNew").value==="true"

};

movies.unshift(movie);

saveJSON(STORAGE_KEY,movies);

buildGenres();

renderHome();

toast("محتوا اضافه شد");

openAdmin();

}

function deleteMovie(id){

if(!confirm("این محتوا حذف شود؟"))
return;

movies=movies.filter(
m=>String(m.id)!==String(id)
);

featuredIds=
featuredIds.filter(
x=>String(x)!==String(id)
);

saveJSON(STORAGE_KEY,movies);
saveJSON(FEATURED_KEY,featuredIds);

buildGenres();
renderHome();

toast("محتوا حذف شد");

openAdmin();

}

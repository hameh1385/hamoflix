<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090613">
<meta name="description" content="HAMOFLIX - فیلم و سریال">
<title>HAMOFLIX</title>

<style>
:root{
  --bg:#090613;
  --glass:rgba(255,255,255,.075);
  --glass2:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.13);
  --purple:#9b5cff;
  --purple2:#6c35d9;
  --text:#fff;
  --muted:#aaa5b8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 0%,rgba(137,65,255,.18),transparent 35%),
    radial-gradient(circle at 100% 35%,rgba(91,37,165,.12),transparent 30%),
    linear-gradient(180deg,#090613,#0d0717 60%,#08050d);
  font-family:Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  display:block;
  max-width:100%;
}

.hidden{
  display:none!important;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  padding:10px 14px;
  background:rgba(9,6,19,.84);
  border-bottom:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  min-width:105px;
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
  user-select:none;
  text-shadow:0 0 18px rgba(155,92,255,.7);
}

.logo span{
  color:#a967ff;
}

.search-box{
  position:relative;
  flex:1;
}

.search{
  width:100%;
  height:43px;
  padding:0 18px;
  color:white;
  outline:none;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(255,255,255,.065);
}

.search::placeholder{
  color:#9f99ab;
}

.search:focus{
  border-color:rgba(155,92,255,.55);
}

.search-results{
  position:absolute;
  top:50px;
  left:0;
  right:0;
  max-height:330px;
  overflow:auto;
  padding:7px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(18,10,32,.97);
  box-shadow:0 15px 40px rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.search-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:11px;
}

.search-item:hover{
  background:rgba(155,92,255,.12);
}

.search-item img{
  width:40px;
  height:55px;
  object-fit:cover;
  border-radius:7px;
}

.search-item-title{
  font-size:13px;
  font-weight:bold;
}

.search-item-info{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* ================= HERO ================= */

.hero{
  max-width:1250px;
  margin:18px auto 0;
  padding:0 14px;
}

.hero-card{
  position:relative;
  overflow:hidden;
  min-height:230px;
  display:flex;
  align-items:flex-end;
  padding:25px;
  border:1px solid var(--border);
  border-radius:24px;
  background:
    linear-gradient(90deg,rgba(8,4,15,.96),rgba(8,4,15,.48),rgba(8,4,15,.12)),
    radial-gradient(circle at 80% 20%,rgba(155,92,255,.35),transparent 35%);
  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.07);
}

.hero-content{
  max-width:600px;
}

.hero-title{
  margin:0 0 8px;
  font-size:clamp(26px,5vw,42px);
  font-weight:900;
}

.hero-text{
  margin:0;
  color:#c0bac9;
  line-height:1.8;
  font-size:13px;
}

/* ================= GENRES ================= */

.genres{
  max-width:1250px;
  margin:15px auto 0;
  padding:0 14px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.genres::-webkit-scrollbar{
  display:none;
}

.genre{
  flex:none;
  padding:9px 14px;
  border:1px solid var(--border);
  border-radius:30px;
  color:#ddd6e8;
  background:var(--glass);
  white-space:nowrap;
}

.genre.active{
  color:#fff;
  background:rgba(155,92,255,.28);
  border-color:rgba(155,92,255,.5);
}

/* ================= MAIN ================= */

main{
  max-width:1250px;
  margin:auto;
  padding-bottom:125px;
}

.section{
  margin-top:27px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px 11px;
}

.section-title{
  margin:0;
  font-size:19px;
  font-weight:900;
}

.section-title::before{
  content:"";
  display:inline-block;
  width:4px;
  height:19px;
  margin-left:8px;
  vertical-align:-3px;
  border-radius:10px;
  background:var(--purple);
  box-shadow:0 0 12px var(--purple);
}

.view-all{
  border:0;
  color:#b989ff;
  background:none;
  font-size:12px;
}

/* ================= HOME CARDS ================= */

/*
  خانه:
  دقیقاً ساختار قبلی حفظ شده:
  یک ردیف افقی
  ۵ کارت + کارت مشاهده همه
  پوسترها ۳:۴
*/

.carousel{
  display:flex;
  gap:12px;
  overflow-x:auto;
  overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;
  padding:3px 14px 13px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.carousel::-webkit-scrollbar{
  display:none;
}

.movie-card{
  position:relative;
  flex:0 0 calc((100% - 48px)/5);
  min-width:0;
  scroll-snap-align:start;
  padding:8px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--glass);
  box-shadow:
    0 9px 25px rgba(0,0,0,.23),
    inset 0 1px rgba(255,255,255,.055);
  transform:translateZ(0);
  contain:layout paint;
}

.poster-wrap{
  position:relative;
  overflow:hidden;

  /* ۳:۴ واقعی */
  aspect-ratio:3/4;

  border-radius:12px;
  background:#171020;
}

.poster{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#171020;
}

.movie-info{
  padding:9px 2px 2px;
}

.movie-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
  font-weight:800;
}

.movie-meta{
  display:flex;
  gap:5px;
  margin-top:5px;
  color:#a9a3b2;
  font-size:10px;
}

.movie-rating{
  color:#e0b1ff;
}

.new-badge{
  position:absolute;
  top:13px;
  right:13px;
  z-index:3;
  padding:4px 7px;
  border-radius:7px;
  color:white;
  background:rgba(155,92,255,.88);
  font-size:9px;
  font-weight:bold;
}

.favorite-btn{
  position:absolute;
  top:12px;
  left:12px;
  z-index:4;
  width:29px;
  height:29px;
  padding:0;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  color:white;
  background:rgba(0,0,0,.48);
}

.favorite-btn.active{
  color:#ff73a2;
}

.see-all-card{
  flex:0 0 calc((100% - 48px)/5);
  min-height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(155,92,255,.3);
  border-radius:17px;
  background:
    radial-gradient(circle,rgba(155,92,255,.18),transparent 65%),
    rgba(255,255,255,.055);
  scroll-snap-align:start;
}

.see-all-inner{
  text-align:center;
}

.see-all-icon{
  width:45px;
  height:45px;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(155,92,255,.16);
  font-size:22px;
}

.see-all-text{
  font-size:13px;
  font-weight:bold;
}

/* ================= FULL PAGES ================= */

.page{
  min-height:calc(100vh - 75px);
  padding:20px 14px 130px;
}

.page-inner{
  max-width:1250px;
  margin:auto;
}

.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.page-title{
  margin:0;
  font-size:25px;
  font-weight:900;
}

.page-subtitle{
  margin:7px 0 0;
  color:#9992a5;
  font-size:12px;
}

.back-btn{
  padding:8px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  color:white;
  background:var(--glass);
}

/*
  صفحات فیلم و سریال:
  کارت‌های بزرگ‌تر
  پوستر ۳:۴
*/

.full-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(165px,1fr));
  gap:15px;
}

.full-grid .movie-card{
  width:100%;
  flex:none;
}

.full-grid .poster-wrap{
  aspect-ratio:3/4;
}

.full-grid .movie-title{
  font-size:14px;
}

.full-grid .movie-meta{
  font-size:11px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:11px;
  z-index:150;
  width:min(430px,calc(100% - 26px));
  transform:translateX(-50%);
  display:flex;
  justify-content:space-around;
  padding:7px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:22px;
  background:rgba(20,11,33,.86);
  box-shadow:
    0 15px 45px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
}

.nav-btn{
  flex:1;
  min-width:65px;
  padding:7px 5px;
  border:0;
  border-radius:15px;
  color:#9d97a8;
  background:transparent;
  font-size:10px;
}

.nav-btn span{
  display:block;
  margin-bottom:3px;
  font-size:18px;
}

.nav-btn.active{
  color:white;
  background:rgba(155,92,255,.2);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.modal-box{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border:1px solid var(--border);
  border-radius:23px;
  background:#120a20;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.close{
  float:left;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  color:white;
  background:rgba(255,255,255,.08);
}

.modal-title{
  margin:0 0 16px;
  font-size:20px;
}

/* ================= DETAIL ================= */

.detail{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:20px;
}

.detail-poster{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:15px;
}

.detail-description{
  color:#b8b1c2;
  line-height:2;
  font-size:13px;
}

.detail-tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0;
}

.tag{
  padding:6px 9px;
  border-radius:9px;
  color:#c9a2ff;
  background:rgba(155,92,255,.12);
}

/* ================= BUTTONS ================= */

.primary{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:13px;
  color:white;
  background:linear-gradient(135deg,#9b5cff,#6530c9);
}

.secondary{
  padding:10px 14px;
  border:1px solid var(--border);
  border-radius:11px;
  color:white;
  background:var(--glass);
}

/* ================= SETTINGS ================= */

.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.setting-info strong{
  display:block;
  font-size:14px;
}

.setting-info small{
  display:block;
  margin-top:4px;
  color:#918a9b;
  font-size:11px;
}

.switch{
  position:relative;
  width:45px;
  height:25px;
  flex:none;
  border:0;
  border-radius:20px;
  background:#312a3b;
}

.switch::after{
  content:"";
  position:absolute;
  top:3px;
  right:22px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#aaa;
  transition:.2s;
}

.switch.on{
  background:#7c42db;
}

.switch.on::after{
  right:3px;
  background:white;
}

/* ================= FORMS ================= */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  color:white;
  background:rgba(255,255,255,.06);
}

textarea.field{
  min-height:100px;
  resize:vertical;
}

.form-full{
  grid-column:1/-1;
}

/* ================= ADMIN ================= */

.admin-list{
  margin-top:15px;
}

.admin-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,.04);
}

.admin-item img{
  width:45px;
  height:60px;
  object-fit:cover;
  border-radius:7px;
}

.admin-item-main{
  flex:1;
}

.delete{
  padding:7px 10px;
  border:0;
  border-radius:8px;
  color:white;
  background:rgba(255,60,90,.16);
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  z-index:500;
  max-width:90%;
  padding:11px 16px;
  transform:translateX(-50%) translateY(15px);
  border:1px solid var(--border);
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  color:white;
  background:rgba(24,14,39,.95);
  box-shadow:0 12px 35px rgba(0,0,0,.4);
  transition:opacity .2s,transform .2s;
  font-size:12px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .movie-card{
    flex-basis:calc((100% - 24px)/3);
  }

  .see-all-card{
    flex-basis:calc((100% - 24px)/3);
  }

  .full-grid{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }
}

@media(max-width:600px){

  body{
    background:
      radial-gradient(circle at 30% 0%,rgba(137,65,255,.15),transparent 35%),
      #090613;
  }

  .header{
    padding:9px 10px;
  }

  .header-inner{
    gap:8px;
  }

  .logo{
    min-width:82px;
    font-size:17px;
  }

  .search{
    height:39px;
    border-radius:13px;
    font-size:12px;
  }

  .hero{
    margin-top:12px;
    padding:0 10px;
  }

  .hero-card{
    min-height:185px;
    padding:18px;
    border-radius:19px;
  }

  .hero-title{
    font-size:26px;
  }

  .hero-text{
    font-size:11px;
  }

  .genres{
    padding:0 10px;
  }

  .section{
    margin-top:22px;
  }

  .section-head{
    padding:0 10px 9px;
  }

  .section-title{
    font-size:16px;
  }

  .carousel{
    gap:9px;
    padding-left:10px;
    padding-right:10px;
  }

  /*
    موبایل:
    کارت‌ها دوباره عمودی ۳:۴
  */

  .movie-card,
  .see-all-card{
    flex-basis:calc((100vw - 29px)/2.25);
  }

  .movie-card{
    padding:7px;
    border-radius:14px;
  }

  .poster-wrap{
    aspect-ratio:3/4;
    border-radius:10px;
  }

  .movie-title{
    font-size:11px;
  }

  .movie-meta{
    font-size:9px;
  }

  /* صفحه کامل فیلم/سریال */

  .page{
    padding:
      16px 10px
      125px;
  }

  .page-title{
    font-size:22px;
  }

  .full-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .full-grid .movie-card{
    padding:7px;
  }

  .full-grid .movie-title{
    font-size:12px;
  }

  .full-grid .movie-meta{
    font-size:9px;
  }

  .bottom-nav{
    bottom:8px;
    width:calc(100% - 22px);
    border-radius:19px;
  }

  .nav-btn{
    min-width:55px;
    padding:6px;
  }

  .nav-btn span{
    font-size:16px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-full{
    grid-column:auto;
  }

  .detail{
    grid-template-columns:110px 1fr;
    gap:12px;
  }

  .detail h2{
    font-size:18px;
  }

  .detail-description{
    font-size:11px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="logo" id="logo">
      HAMO<span>FLIX</span>
    </div>

    <div class="search-box">

      <input
        id="searchInput"
        class="search"
        type="search"
        autocomplete="off"
        placeholder="جستجوی فیلم یا سریال..."
      >

      <div
        id="searchResults"
        class="search-results hidden">
      </div>

    </div>

  </div>

</header>

<section class="hero">

  <div class="hero-card">

    <div class="hero-content">

      <h1 class="hero-title">
        HAMOFLIX
      </h1>

      <p class="hero-text">
        دنیای فیلم و سریال مورد علاقه‌ات،
        سریع و سبک روی گوشی.
      </p>

    </div>

  </div>

</section>

<div id="genres" class="genres"></div>

<main id="main"></main>

<!--
  این قسمت عمداً همیشه ثابت و شناور است.
  هر دکمه صفحه کامل مربوط به خودش را باز می‌کند.
-->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    data-nav="home">

    <span>⌂</span>
    خانه

  </button>

  <button
    class="nav-btn"
    data-nav="movies">

    <span>🎬</span>
    فیلم‌ها

  </button>

  <button
    class="nav-btn"
    data-nav="series">

    <span>📺</span>
    سریال‌ها

  </button>

  <button
    class="nav-btn"
    data-nav="settings">

    <span>⚙</span>
    تنظیمات

  </button>

</nav>

<div
  id="modal"
  class="modal hidden">

  <div
    id="modalBox"
    class="modal-box">
  </div>

</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   HAMOFLIX
   OPTIMIZED + 3:4 POSTERS + FULL MOVIE/SERIES PAGES
   ========================================================= */

const STORAGE_KEY="hamoflix_movies_v4";
const FAVORITES_KEY="hamoflix_favorites";
const RATINGS_KEY="hamoflix_ratings";
const WATCHING_KEY="hamoflix_watching";
const SETTINGS_KEY="hamoflix_settings";

const FALLBACK_POSTER=
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="600" height="800">

<rect width="100%" height="100%"
fill="#171020"/>

<text
x="50%"
y="50%"
fill="#9b5cff"
font-size="42"
text-anchor="middle"
dominant-baseline="middle"
font-family="Arial">

HAMOFLIX

</text>

</svg>
`);

/* ================= DATA ================= */

const defaultMovies=[

{
 id:"wednesday",
 title:"Wednesday",
 type:"series",
 genre:"فانتزی",

/* ================= STATE ================= */

function loadJSON(key,fallback){

  try{

    const x=localStorage.getItem(key);

    return x?JSON.parse(x):fallback;

  }catch(e){

    return fallback;

  }
}

function saveJSON(key,value){

  try{
    localStorage.setItem(
      key,
      JSON.stringify(value)
    );
  }catch(e){}

}

  loadJSON(STORAGE_KEY,null);

}

/* ================= HELPERS ================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function posterURL(url){

  return url||FALLBACK_POSTER;

}

function toast(message){

  const el=
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer=setTimeout(()=>{

    el.classList.remove("show");

  },2200);

}

function buildGenres(){

  const genres=[
    "همه",
    ...new Set(
      movies
        .map(m=>m.genre)
        .filter(Boolean)
    )
  ];

  document.getElementById("genres")
    .innerHTML=
      genres.map(g=>`

        <button
          class="genre ${g===currentGenre?"active":""}"
          data-genre="${escapeHTML(g)}">

          ${escapeHTML(g)}

        </button>

      `).join("");

  document
    .querySelectorAll(".genre")
    .forEach(btn=>{

      btn.onclick=()=>{

        currentGenre=
          btn.dataset.genre;

        buildGenres();
        renderHome();

      };

    });

}

function getFilteredMovies(){

  let list=[...movies];

  if(currentGenre!=="همه"){

    list=
      list.filter(
        m=>m.genre===currentGenre
      );

  }

  return list;

}

function renderSection(section){

  let list=
    getFilteredMovies()
      .filter(section.filter);

  list.sort((a,b)=>{

    if(a.isNew&&!b.isNew)
      return -1;

    if(!a.isNew&&b.isNew)
      return 1;

    return Number(b.rating||0)-
           Number(a.rating||0);

  });

  const visible=
    list.slice(0,5);

  if(!visible.length)
    return "";

  return `

    <section class="section">

      <div class="section-head">

        <h2 class="section-title">
          ${section.title}
        </h2>

        <button
          class="view-all"
          onclick="openAll('${section.id}')">

          مشاهده همه

        </button>

      </div>

      <div class="carousel">

        ${visible.map(movieCard).join("")}

        <div
          class="see-all-card"
          onclick="openAll('${section.id}')">

          <div class="see-all-inner">

            <div class="see-all-icon">
              ＋
            </div>

            <div class="see-all-text">
              مشاهده همه
            </div>

          </div>

        </div>

      </div>

    </section>

  `;

}

function renderHome(){

  document.getElementById("main")
    .innerHTML=
      sectionData
        .map(renderSection)
        .join("");

}

    WATCHING_KEY,
    watching

    movies
      .filter(m=>

          m.genre===movie.genre ||
          m.section===movie.section

    <button
      class="close"

        class="detail-poster"

          }

          ${

            `<span class="tag">
              ${escapeHTML(movie.year)}
            </span>`

          }

        </div>

        <p>
          ⭐ امتیاز:
          <strong>
            ${escapeHTML(movie.rating||"—")}
          </strong>
        </p>

        <p class="detail-description">
          ${escapeHTML(
            movie.description||

        <button

function watchMovie(id){

  const movie=
    movies.find(
      m=>String(m.id)===String(id)
    );

  if(!movie)
    return;

  if(
    movie.watch &&
    movie.watch!=="#"
  ){

    window.open(
      movie.watch,
      "_blank",
      "noopener"
    );

  }else{

    toast(
      "لینک مشاهده هنوز ثبت نشده است."
    );

  }

}

/* ================= FAVORITES ================= */

function toggleFavorite(id,event){

  if(event)
    event.stopPropagation();

  const index=
    favorites.indexOf(id);

  if(index>=0){

    favorites.splice(index,1);

    toast(
      "از علاقه‌مندی‌ها حذف شد"
    );

  }else{

    favorites.push(id);

    toast(
      "به علاقه‌مندی‌ها اضافه شد"
    );

  }

  saveJSON(
    FAVORITES_KEY,
    favorites
  );

  /*
    اگر صفحه خانه باشد دوباره رندر می‌کنیم.
    اگر صفحه فیلم‌ها/سریال‌ها باشد هم همان صفحه را
    دوباره می‌سازیم.
  */

  const active=
    document.querySelector(
      ".nav-btn.active"
    );

  if(
    active &&
    active.dataset.nav==="movies"
  ){

    openMoviesPage();

  }else if(
    active &&
    active.dataset.nav==="series"
  ){

    openSeriesPage();

  }else{

    renderHome();

  }

}

}

                      src="${escapeHTML(posterURL(m.poster))}"

          box.classList.remove(

    .forEach(btn=>{

        "active",
        btn.dataset.nav===nav
      );

    });

}

/* ================= SETTINGS ACTIONS ================= */

function toggleNotificationsPage(){

  if(
    !settings.notifications &&
    "Notification" in window
  ){

    Notification
      .requestPermission()
      .then(permission=>{

        if(permission==="granted"){

          settings.notifications=true;

          saveJSON(
            SETTINGS_KEY,
            settings
          );

          toast(
            "اعلان‌ها فعال شدند"
          );

        }

        openSettingsPage();

      });

  }else{

    settings.notifications=
      !settings.notifications;

    saveJSON(
      SETTINGS_KEY,
      settings
    );

    openSettingsPage();

  }

}

function toggleContinuePage(){

  settings.continueWatching=
    !settings.continueWatching;

  saveJSON(
    SETTINGS_KEY,
    settings
  );

  openSettingsPage();

}

            <select

              </option>

              <option value="movie">
                فیلم

            </select>

            <input
              id="advRating"
              class="field"
              type="number"
              min="0"
              max="10"
              step=".1"
              placeholder="حداقل امتیاز">

          </div>

          <button
            class="primary"
            onclick="runAdvancedSearchPage()">

            جستجو

          </button>

          <div
            id="advancedResults"
            style="margin-top:20px">

function runAdvancedSearchPage(){

  const title=
    document.getElementById("advTitle")
      .value
      .trim()
      .toLowerCase();

  const type=
    document.getElementById("advType").value;

  const genre=
    document.getElementById("advGenre")
      .value
      .trim()
      .toLowerCase();

  const year=
    document.getElementById("advYear")
      .value
      .trim();

  const rating=
    Number(
      document.getElementById("advRating").value
    )||0;

  const result=
    movies.filter(m=>{

      if(
        title &&
        !m.title
          .toLowerCase()
          .includes(title)
      )
        return false;

      if(
        type &&
        m.type!==type
      )
        return false;

      if(
        genre &&
        !(m.genre||"")
          .toLowerCase()
          .includes(genre)
      )
        return false;

      if(
        year &&
        m.year!==year
      )
        return false;

      if(
        rating &&
        Number(m.rating||0)<rating
      )
        return false;

      return true;

    });

  document.getElementById(
    "advancedResults"
  ).innerHTML=`

    <h3>
      ${result.length} نتیجه
    </h3>

    <div class="full-grid">
      ${result.map(movieCard).join("")}
    </div>

  `;

}

function addMovie(){

  const title=
    document
      .getElementById("aTitle")
      .value
      .trim();

  if(!title){

    toast(
      "نام را وارد کن"
    );

    return;

  }

  const movie={

    id:
      "m_"+
      Date.now()+
      "_"+
      Math.random()
        .toString(36)
        .slice(2,7),

    title,

    type:
      document
        .getElementById("aType")
        .value,

    genre:
      document
        .getElementById("aGenre")
        .value
        .trim(),

    year:
      document
        .getElementById("aYear")
        .value
        .trim(),

    rating:
      document
        .getElementById("aRating")
        .value
        .trim(),

    poster:
      document
        .getElementById("aPoster")
        .value
        .trim(),

    watch:
      document
        .getElementById("aWatch")
        .value
        .trim(),

    description:
      document
        .getElementById("aDescription")
        .value
        .trim(),

    section:
      document
        .getElementById("aSection")
        .value,

    isNew:
      document
        .getElementById("aNew")
        .value==="true"

  };

  movies.unshift(movie);

  saveJSON(
    STORAGE_KEY,
    movies
  );

  buildGenres();
  renderHome();

  toast(
    "محتوا اضافه شد"
  );

  openAdmin();

}

function deleteMovie(id){

  if(
    !confirm(
      "این محتوا حذف شود؟"
    )
  )
    return;

  movies=
    movies.filter(
      m=>String(m.id)!==
        String(id)
    );

  saveJSON(
    STORAGE_KEY,
    movies
  );

  buildGenres();
  renderHome();

  toast(
    "محتوا حذف شد"
  );

  openAdmin();

}
